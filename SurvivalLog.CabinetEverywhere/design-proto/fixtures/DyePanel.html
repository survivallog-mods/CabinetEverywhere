<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>染料桶</title>
<script src="../../webui-core.js"></script>
<script src="../../webui-bag.js"></script>
<style>
:root{
  --warm-gold:#e8b04b; --amber:#c8873a; --ok-green:#7fae62;
  --danger-red:#e05555; --text-main:#fcfcfc; --text-dark:#c0c0c0;
  --border-light:rgba(255,255,255,.18); --border-color:rgba(255,255,255,.12);
  --grid-bg:rgba(20,15,12,.85); --slot-border:rgba(255,255,255,.1);
  --slot:38px; --gap:5px;
}
*{box-sizing:border-box;}
body{ margin:0; background-color:transparent; color:var(--text-main);
  font-family:'Segoe UI',"Microsoft YaHei",sans-serif; line-height:1.6;
  display:flex; justify-content:center; align-items:center; min-height:100vh;
  user-select:none; overflow:hidden; text-shadow:0 1px 2px rgba(0,0,0,.6); }
body::before{ content:''; position:absolute; inset:0; z-index:-1; pointer-events:none;
  background-color:rgba(15,10,8,.42);
  background-image:radial-gradient(circle at 28% 12%,rgba(200,135,58,.11),transparent 55%),
                   radial-gradient(circle at 82% 92%,rgba(157,184,138,.07),transparent 55%); }

.dye-system{ display:flex; gap:14px; align-items:stretch; position:relative;
  background-image:radial-gradient(circle at 50% 100%,rgba(200,135,58,.20) 0%,transparent 62%),
                   linear-gradient(135deg,rgba(65,52,45,.96) 0%,rgba(32,25,21,.98) 100%);
  padding:15px; border-radius:12px; border:1px solid var(--border-light);
  box-shadow:0 25px 60px rgba(0,0,0,.82),inset 0 1px 0 rgba(255,255,255,.14); }
.col{ background:linear-gradient(180deg,rgba(55,48,44,.85) 0%,rgba(33,27,24,.95) 100%);
  border:1px solid rgba(255,255,255,.14); border-radius:8px; padding:12px;
  display:flex; flex-direction:column;
  box-shadow:inset 0 2px 10px rgba(0,0,0,.4),0 4px 15px rgba(0,0,0,.2); }
.col-t{ font-size:14px; font-weight:bold; color:var(--warm-gold); margin-bottom:9px;
  letter-spacing:1.5px; display:flex; align-items:center; flex-shrink:0;
  text-shadow:0 0 10px rgba(232,176,75,.4); }
.col-t::before{ content:''; width:4px; height:14px; background:var(--warm-gold);
  margin-right:7px; border-radius:2px; box-shadow:0 0 8px rgba(232,176,75,.8); }
.col-t .r{ margin-left:auto; font-size:12px; font-weight:600; letter-spacing:0;
  color:var(--text-dark); font-family:Consolas,monospace; text-shadow:none; }

/* 标题旁「?」：点开 / 再点或点别处收起的规则说明卡 */
.col-t.has-help{ position:relative; }
.col-t .hq{ margin:0 8px; width:18px; height:18px; padding:0; border-radius:50%; flex-shrink:0; cursor:pointer;
  border:1px solid rgba(232,176,75,.5); background:rgba(232,176,75,.1); color:var(--warm-gold);
  font-family:Georgia,serif; font-size:12px; font-weight:bold; font-style:italic; line-height:16px; text-align:center; letter-spacing:0; }
.col-t .hq:hover,.col-t .hq.on{ background:rgba(232,176,75,.25); border-color:var(--warm-gold); }
.help-pop{ position:absolute; top:calc(100% + 4px); left:0; z-index:60; width:400px; padding:12px 14px 13px; border-radius:8px;
  background:linear-gradient(180deg,rgba(55,48,44,.99) 0%,rgba(33,27,24,.99) 100%); border:1px solid rgba(232,176,75,.35);
  box-shadow:0 12px 30px rgba(0,0,0,.7); text-shadow:none; cursor:default; letter-spacing:0; font-weight:normal; }
.help-pop[hidden]{ display:none; }
.help-pop .hp-t{ font-size:13px; font-weight:bold; color:var(--warm-gold); letter-spacing:1px; margin-bottom:8px; }
.help-pop ul{ margin:0; padding:0; list-style:none; }
.help-pop li{ position:relative; padding-left:12px; font-size:12px; line-height:1.65; color:var(--text-main); }
.help-pop li + li{ margin-top:5px; }
.help-pop li::before{ content:''; position:absolute; left:1px; top:8px; width:4px; height:4px; border-radius:50%; background:rgba(232,176,75,.75); }

/* ── 左栏页签（与 BrewPanel / Cooking 逐项对齐，母本改了这里必须跟）── */
.bag-tabs{ display:none; flex-wrap:nowrap; align-items:stretch; gap:4px;
  width:0; min-width:100%; margin-bottom:6px; flex-shrink:0; box-sizing:border-box; }
.bag-tab{ padding:5px 11px; font-size:13px; color:var(--text-dark); cursor:pointer; user-select:none;
  background:rgba(20,15,12,.55); border:1px solid var(--border-color); border-radius:6px;
  transition:background .15s,color .15s,border-color .15s; white-space:nowrap; flex-shrink:0; }
.bag-tab:hover{ background:rgba(232,176,75,.12); color:var(--text-main); border-color:rgba(232,176,75,.5); }
.bag-tab.active{ background:linear-gradient(180deg,rgba(232,176,75,.25) 0%,rgba(232,176,75,.1) 100%);
  color:var(--warm-gold); border-color:var(--warm-gold); cursor:default;
  box-shadow:inset 0 0 8px rgba(232,176,75,.35); }
.bag-tab.locked{ color:rgba(255,255,255,.28); background:rgba(18,14,12,.85); border-color:rgba(255,255,255,.06); cursor:not-allowed; }
.bag-tab.locked:hover{ background:rgba(18,14,12,.85); color:rgba(255,255,255,.28); border-color:rgba(255,255,255,.06); }
.tab-lock-badge{ display:inline-block; width:10px; height:10px; position:relative; margin-left:5px; vertical-align:-1px; opacity:.7; pointer-events:none; }
.tab-lock-badge::before{ content:''; position:absolute; top:0; left:2px; width:6px; height:5px;
  border:1.5px solid rgba(255,255,255,.45); border-bottom:none; border-radius:4px 4px 0 0; }
.tab-lock-badge::after{ content:''; position:absolute; bottom:0; left:0; width:10px; height:5px;
  background:rgba(255,255,255,.45); border-radius:2px; }
.bag-tab-pinned-slot{ flex-shrink:0; display:flex; gap:4px; position:relative; margin-right:11px; }
.bag-tab-pinned-slot::after{ content:''; position:absolute; right:-6px; top:22%; bottom:22%;
  width:1px; background:var(--border-light); pointer-events:none; }
.bag-tabs-scroll{ flex:1 1 0; min-width:0; overflow-x:hidden; overflow-y:visible;
  display:flex; gap:4px; scroll-behavior:smooth; }
.bag-tabs-scroll::-webkit-scrollbar{ display:none; }
.tab-scroll-btn{ flex-shrink:0; width:22px; padding:0; line-height:1;
  background:rgba(20,15,12,.55); color:var(--text-dark);
  border:1px solid var(--border-color); border-radius:6px;
  cursor:pointer; font-size:16px; font-weight:bold; font-family:inherit;
  transition:background .15s,color .15s,opacity .15s;
  display:none; align-items:center; justify-content:center; user-select:none; }
.tab-scroll-btn.is-visible{ display:flex; }
.tab-scroll-btn:hover:not(:disabled){ background:rgba(232,176,75,.12); color:var(--warm-gold); border-color:rgba(232,176,75,.5); }
.tab-scroll-btn:disabled{ opacity:.3; cursor:not-allowed; }

/* ── 左栏背包网格（照抄 BrewPanel，含 10 项与 BackpackUI 对齐的标记）── */
.grid-container{ background:var(--grid-bg); padding:9px; border-radius:6px; position:relative;
  display:grid; gap:var(--gap); border:1px solid var(--border-color);
  box-shadow:inset 0 5px 20px rgba(0,0,0,.85); width:fit-content; }
.grid-container.is-frozen .slot{ background:#16293d; border-color:rgba(130,180,240,.45); }
.grid-container.is-frozen .slot.valid-hover{ background:rgba(232,176,75,.20); border-color:var(--warm-gold); }
.grid-container.is-frozen .slot.invalid-hover{ background:rgba(224,85,85,.2); border-color:var(--danger-red); }
.grid-container.is-frozen .item{ border-color:rgba(130,180,240,.5); }
.item-frost{ position:absolute; inset:0; pointer-events:none; border-radius:3px;
  background-image:url('../BackpackUI/Refrigerator_ICE.png');
  background-size:100% auto; background-repeat:no-repeat; background-position:top center;
  z-index:3; }
.slot{ width:var(--slot); height:var(--slot); background:rgba(12,9,8,.8);
  border:1px solid var(--slot-border); border-radius:4px;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.6); position:relative; box-sizing:border-box; transition:all .15s; }
.slot.valid-hover{ background:rgba(232,176,75,.20); border-color:var(--warm-gold);
  box-shadow:inset 0 0 15px rgba(232,176,75,.38); }
.slot.invalid-hover{ background:rgba(224,85,85,.2); border-color:var(--danger-red);
  box-shadow:inset 0 0 15px rgba(224,85,85,.4); }
.item{ position:absolute; z-index:10; cursor:grab; display:flex; align-items:center; justify-content:center;
  background:linear-gradient(135deg,rgba(70,60,55,.95),rgba(45,38,34,.95));
  border:1px solid rgba(255,255,255,.28); border-radius:4px;
  box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2); transition:filter .1s,transform .1s; }
.item img{ max-width:84%; max-height:84%; object-fit:contain; pointer-events:none;
  position:relative; z-index:2; filter:drop-shadow(0 2px 3px rgba(0,0,0,.8)); }
.item:hover{ filter:brightness(1.25); border-color:var(--warm-gold);
  box-shadow:0 0 14px rgba(232,176,75,.5); transform:scale(1.04); z-index:150; }
.item:active{ cursor:grabbing; transform:scale(1); z-index:9999; }
.item-count{ position:absolute; bottom:1px; right:3px; font-size:12px; font-weight:bold; color:#fff;
  text-shadow:0 1px 2px #000,0 0 3px rgba(0,0,0,.9); pointer-events:none; z-index:6; line-height:1; }

.item.q-perfect{ border-color:#FFC107; box-shadow:0 0 14px 1px rgba(255,193,7,.45),inset 0 0 8px rgba(255,193,7,.12),0 4px 10px rgba(0,0,0,.6); }
.item.q-good{ border-color:#B988E6; box-shadow:0 0 10px rgba(185,136,230,.35),inset 0 0 6px rgba(185,136,230,.10),0 4px 10px rgba(0,0,0,.6); }
.item.q-normal{ border-color:rgba(255,255,255,.55); }
.item.q-fail{ border-color:#707070; box-shadow:inset 0 0 14px rgba(0,0,0,.55),0 0 4px rgba(0,0,0,.3); filter:saturate(.5) brightness(.85); }
.item.q-fail img{ filter:grayscale(.55); }
.item.q-perfect:hover{ border-color:#FFC107; box-shadow:0 0 14px 1px rgba(255,193,7,.45),inset 0 0 8px rgba(255,193,7,.12),0 4px 10px rgba(0,0,0,.6); }
.item.q-good:hover{ border-color:#B988E6; box-shadow:0 0 10px rgba(185,136,230,.35),inset 0 0 6px rgba(185,136,230,.10),0 4px 10px rgba(0,0,0,.6); }
.item.q-normal:hover{ border-color:rgba(255,255,255,.55); }
.item.q-fail:hover{ border-color:#707070; filter:saturate(.5) brightness(1.05); }
.item.in-action:hover{ border-color:rgba(38,198,218,.85); }
.item.expired:hover{ border-color:rgba(178,72,55,.75); }

.item.expired{ border-color:rgba(178,72,55,.75) !important; }
.expired-mask{ position:absolute; inset:0; border-radius:3px; pointer-events:none; z-index:0;
  background:linear-gradient(to top,rgba(146,52,38,.7) 0%,rgba(146,52,38,.45) 35%,rgba(146,52,38,.15) 75%,rgba(146,52,38,0) 100%); }
/* 快过期：底部 12px 贴底黄晕（无硬线），与已过期的暗红褐满片染底靠色相+范围+浓度区分 */
.near-expiry-mask{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:5;
  background:linear-gradient(to top,rgba(255,210,60,.42) 0px,rgba(255,210,60,.18) 5px,rgba(255,210,60,0) 12px)}
.polluted-ring{ position:absolute; inset:0; border:2px solid rgba(140,220,110,.9); border-radius:6px;
  box-shadow:inset 0 0 12px rgba(110,190,90,.55); pointer-events:none; z-index:4;
  animation:polluted-breathe 2s ease-in-out infinite; }
@keyframes polluted-breathe{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }
html.quality-low .polluted-ring{ animation:none; opacity:.8; }
.item.in-action{ border-color:rgba(38,198,218,.85); }
.action-glow{ position:absolute; inset:0; border-radius:inherit; pointer-events:none; z-index:2; opacity:.85;
  box-shadow:inset 0 0 8px rgba(38,198,218,.35),inset 0 0 2px rgba(38,198,218,.55); }
.item.in-action.using .action-glow{ animation:action-mark-breathe 1.6s ease-in-out infinite; }
@keyframes action-mark-breathe{ 0%,100%{ opacity:.45; } 50%{ opacity:1; } }
html.quality-low .item.in-action.using .action-glow{ animation:none; opacity:.85; }
.story-badge{ position:absolute; top:-4px; right:-4px; width:13px; height:13px; z-index:6;
  pointer-events:none; font-size:10px; line-height:13px; text-align:center;
  color:#ffe9a8; text-shadow:0 0 4px rgba(0,0,0,.9); }
.use-times{ position:absolute; top:1px; left:3px; font-size:10px; font-weight:bold; color:#d9e8ff;
  text-shadow:0 1px 2px #000; pointer-events:none; z-index:6; line-height:1; font-family:Consolas,monospace; }

/* 面板小字统一 ≥ 12px、不叠 opacity：11px 中文在 WebUI（CSS 1px = 1.25 物理像素，Editor 窗口非 16:9 时还会再缩放一次）下发虚 */
.hint-shift{ width:0; min-width:100%; margin-top:10px; font-size:12px; line-height:1.5;
  color:var(--warm-gold); }

/* ── 中栏：染料桶。桶 = 外框本身；扁平语言：不做木纹 / 金属件，「是只桶」靠两道细线箍示意 ── */
.vat-col{ align-items:stretch; }
.vat{ position:relative; border-radius:8px; border:1px solid var(--border-color); background:var(--grid-bg);
  box-shadow:inset 0 3px 12px rgba(0,0,0,.55); padding-bottom:14px; }
.vat .hoop{ position:absolute; left:0; right:0; height:0; border-top:1px solid rgba(255,255,255,.10);
  pointer-events:none; z-index:5; }
.vat .hoop.top{ top:28px; }
.vat .hoop.bot{ bottom:7px; }
.vat-lid{ height:28px; display:flex; align-items:center; justify-content:space-between; padding:0 10px;
  font-size:12px; font-family:Consolas,monospace; color:var(--text-dark);
  background:rgba(255,255,255,.04); border-radius:8px 8px 0 0; }
.vat-lid .st.idle{ color:#9c9184; }
.vat-lid .st.run{ color:var(--warm-gold); }
.vat-lid .st.done{ color:var(--ok-green); font-weight:700; }
.vat-in{ position:relative; margin:10px 10px 0; width:fit-content; }
.vat-in .grid-container{ background:rgba(0,0,0,.34); box-shadow:inset 0 2px 8px rgba(0,0,0,.7); }
/* 染色中罩在格子区上的染液（颜色 = 本批主色） */
.wash{ position:absolute; inset:0; border-radius:6px; opacity:0; pointer-events:none; z-index:30;
  mix-blend-mode:screen; transition:opacity .5s; }
.vat.run .wash{ opacity:.2; }
.bubbles{ position:absolute; inset:0; pointer-events:none; z-index:31; overflow:hidden; border-radius:6px; display:none; }
.vat.run .bubbles{ display:block; }
.wbub{ position:absolute; bottom:4px; border-radius:50%; background:rgba(255,255,255,.4);
  animation:vrise linear infinite; }
@keyframes vrise{ 0%{transform:translateY(0) scale(.6);opacity:0} 22%{opacity:.85} 100%{transform:translateY(-34px) scale(1);opacity:0} }
html.quality-low .wbub{ animation:none; display:none; }
/* 原料槽物品：参与本批的描一圈本批颜色（套用下面左栏的 dye-want，即它在背包里的高亮色；还没有主色时保持普通框，dye-hit 只作标记）、
   不参与半透明；染色中不可拖 */
.item.dye-off{ opacity:.38; }
/* 左栏：选了颜色后，含这种颜色的植物描一圈该色（--want 由 paintBagItem 写成内联变量） */
.item.dye-want{ border-color:var(--want); box-shadow:0 0 0 1px var(--want),0 0 12px var(--want),inset 0 0 8px var(--want),0 4px 10px rgba(0,0,0,.6); }
.item.dye-want:hover{ border-color:var(--want); box-shadow:0 0 0 1px var(--want),0 0 16px var(--want),inset 0 0 9px var(--want); }
/* 描了颜色的植物右下角：当前颜色水滴 + 每个给这种颜色的点数（植物不堆叠，右下角不会和数量相撞） */
.dye-pts{ position:absolute; bottom:1px; right:1px; display:flex; align-items:center; gap:1px; padding:1px 3px 1px 2px; border-radius:3px;
  font-size:11px; font-weight:bold; line-height:1; font-family:Consolas,monospace; color:#fff; background:rgba(0,0,0,.62);
  text-shadow:none; pointer-events:none; z-index:7; }
.dye-pts .drop{ width:7px; height:9px; margin:0; vertical-align:0; }
/* 染色中原料槽锁定：里面的物品不可交互，去掉抓手光标与悬停放大 / 发光，只保留悬停提示 */
#vatGrid.locked .item{ cursor:default !important; }
#vatGrid.locked .item:hover, #vatGrid.locked .item:active{ filter:none; transform:none; }
#vatGrid.locked .item:not(.dye-want):hover{ border-color:rgba(255,255,255,.28); box-shadow:0 4px 10px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.2); }
#vatGrid.locked .item.dye-want:hover{ border-color:var(--want); box-shadow:0 0 0 1px var(--want),0 0 12px var(--want),inset 0 0 8px var(--want),0 4px 10px rgba(0,0,0,.6); }
.vat.run .item{ cursor:default !important; }

.funnel{ display:block; width:96px; height:24px; margin:-1px auto -1px; position:relative; z-index:2; }

/* 成品架：框高固定；桶数一变就重算行列，桶铺满框，桶越多每只越小 */
.shelf{ border-radius:8px; border:1px solid rgba(255,255,255,.10); background:rgba(12,9,7,.55);
  box-shadow:inset 0 3px 12px rgba(0,0,0,.5); padding:7px 10px 8px; }
.cap{ font-size:12px; color:var(--text-dark); letter-spacing:1px; margin:0 0 6px; display:flex; }
.cap .r{ margin-left:auto; font-family:Consolas,monospace; letter-spacing:0; }
.shelf .cap{ margin-bottom:4px; }
.shelf-body{ height:130px; display:flex; flex-direction:column; justify-content:space-evenly; }
.shelf-row{ display:flex; justify-content:flex-start; border-bottom:3px solid rgba(200,135,58,.24); border-radius:0 0 2px 2px; }
.bk{ flex:0 0 auto; display:flex; align-items:flex-end; justify-content:center; position:relative; }
.bk svg{ display:block; overflow:visible; }
.bk.done{ cursor:pointer; }
.bk.done svg{ filter:drop-shadow(0 0 4px rgba(127,174,98,.7)); }
.bk.done:hover svg{ filter:drop-shadow(0 0 9px rgba(127,174,98,1)); }
.bk .t{ position:absolute; left:0; right:0; bottom:26%; text-align:center; font-weight:bold;
  font-family:Consolas,monospace; color:#fff; text-shadow:0 1px 2px #000,0 0 3px #000; pointer-events:none; }

/* ── 右栏：染色。产物（一只大桶，液面 = 主色点数 / 每桶点数）与色素同一块 ── */
.res-col{ width:250px; }
.stage{ flex:1 1 auto; border-radius:8px; border:1px solid rgba(255,255,255,.1); padding:12px 12px 10px;
  background:radial-gradient(ellipse at 22% 30%,rgba(232,176,75,.13),transparent 62%),rgba(12,9,7,.75);
  box-shadow:inset 0 3px 14px rgba(0,0,0,.7); }
.prod{ display:flex; align-items:center; gap:12px; min-height:80px; }
.prod svg{ display:block; width:60px; height:66px; flex:0 0 auto; overflow:visible; }
.prod .info{ min-width:0; }
.prod .nm{ font-size:14px; font-weight:bold; letter-spacing:.5px; line-height:1.35; }
.prod .x{ font-family:Consolas,monospace; font-size:24px; font-weight:bold; line-height:1.15; color:var(--warm-gold); }
.prod .x .s{ font-size:13px; opacity:.65; margin:0 2px; color:var(--text-main); }
.prod .sub{ font-size:12px; color:#c4bbb1; line-height:1.4; }
.prod.dim{ opacity:.6; }
.stage .sep{ height:1px; background:rgba(255,255,255,.08); margin:10px 0 8px; }
/* 提取颜色下拉：只列已解锁颜色（色位序），没有「不选」项；没选过时按钮显示「未选择」（= 按含量最多的颜色出）。
   颜色会继续加（十几种），列表限高 10 项、超出滚动；染色中 / 本批完成时锁住，只显示本批颜色、点不开 */
.dd{ position:relative; }
.dd-btn{ position:relative; display:flex; align-items:center; width:100%; height:28px; padding:0 24px 0 8px; border-radius:5px;
  font-family:inherit; font-size:13px; color:#e6ddd2; text-align:left; cursor:pointer;
  background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.18); transition:background .15s,border-color .15s; }
.dd-btn .t{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.dd-btn::after{ content:''; position:absolute; right:9px; top:50%; margin-top:-2px;
  border-left:4px solid transparent; border-right:4px solid transparent; border-top:5px solid #b9b0a6; }
.dd-btn:hover{ background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.32); }
.dd:not(.sel) .dd-btn .t{ color:#a39a8f; }
.dd.sel .dd-btn{ color:#fff; font-weight:bold; border-color:var(--pc); box-shadow:inset 0 0 0 1px var(--pc); }
.dd.open .dd-btn::after{ border-top:0; border-bottom:5px solid #e6ddd2; }
.dd.off .dd-btn{ cursor:default; }
.dd.off .dd-btn:hover{ background:rgba(0,0,0,.35); }
.dd.off .dd-btn::after{ display:none; }
.dd-list{ display:none; position:absolute; left:0; right:0; top:calc(100% + 3px); z-index:30;
  max-height:266px; overflow-y:auto; padding:3px; border-radius:6px;
  background:#1b1612; border:1px solid rgba(255,255,255,.2); box-shadow:0 6px 18px rgba(0,0,0,.65); }
.dd.open .dd-list{ display:block; }
.dd-it{ display:flex; align-items:center; height:26px; padding:0 7px; border-radius:4px;
  font-size:13px; color:#d6cdc2; white-space:nowrap; cursor:pointer; }
.dd-it:hover{ background:rgba(255,255,255,.08); color:#fff; }
.dd-it.on{ color:#fff; font-weight:bold; background:rgba(255,255,255,.05); box-shadow:inset 2px 0 0 var(--pc); }
.dd-list::-webkit-scrollbar{ width:6px; }
.dd-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:3px; }
.pig{ display:flex; flex-direction:column; gap:4px; }
.pig-empty{ font-size:12px; color:#8f867d; padding-top:4px; }
.pr{ display:flex; align-items:center; gap:6px; font-size:12px; color:#c4bbb1; height:16px; }
/* 色名写全名（最长「鼠尾草绿」4 字 + 水滴约 61px）：最小宽度保证中文各行色条左端对齐，外文更长时向右撑开、不压色条 */
.pr .nmc{ min-width:62px; white-space:nowrap; }
.pr .bar{ flex:1; height:9px; border-radius:3px; background:rgba(0,0,0,.5); position:relative; overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.7); }
.pr .bar i{ position:absolute; left:0; top:0; bottom:0; width:100%; opacity:.9; transform-origin:left; }
.pr .bar b{ position:absolute; inset:0; }
.pr .v{ width:26px; text-align:right; font-family:Consolas,monospace; color:#d8cfc4; }
.pr.main{ color:var(--text-main); }
.pr.main .v{ color:var(--warm-gold); font-weight:bold; }
.drop{ display:inline-block; width:9px; height:12px; vertical-align:-1px; margin-right:4px; }
.drop svg{ display:block; width:100%; height:100%; }

.tsec{ padding-top:12px; }
.tline{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--text-dark); margin-bottom:5px; }
.tline .v{ margin-left:auto; font-family:Consolas,monospace; font-size:13px; color:var(--text-main); font-weight:bold; }
.timebar{ height:11px; background:rgba(0,0,0,.6); border:1px solid rgba(255,255,255,.1); border-radius:6px; overflow:hidden;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.75); }
.timebar-fill{ width:100%; height:100%; transform:scaleX(0); transform-origin:left;
  background:linear-gradient(90deg,#96601f,var(--amber) 60%,var(--warm-gold)); transition:transform .3s; }
.timebar-fill.done{ background:linear-gradient(90deg,#4d7a3a,var(--ok-green)); }
.note{ font-size:12px; min-height:35px; margin:7px 0 0; line-height:1.45; color:#c4bbb1; text-align:center; }
.note .warn-t{ color:#f1a36b; }
.note .bad{ color:var(--danger-red); font-weight:bold; }
.btns{ display:flex; gap:8px; margin-top:6px; }
.btn{ flex:1; padding:9px 0; border-radius:6px; font-family:inherit; font-size:14px; font-weight:bold; letter-spacing:2px;
  cursor:pointer; color:#fff; border:1px solid rgba(255,255,255,.18); text-shadow:0 1px 2px rgba(0,0,0,.6);
  background:linear-gradient(180deg,rgba(168,118,28,.95),rgba(110,76,16,.97)); }
.btn:hover{ background:linear-gradient(180deg,rgba(200,145,40,.97),rgba(140,96,22,.98)); }
.btn.take{ background:linear-gradient(180deg,rgba(127,174,98,.92),rgba(80,116,58,.94)); }
.btn.take:hover{ background:linear-gradient(180deg,rgba(150,196,118,.95),rgba(96,138,70,.96)); }
.btn.dis, .btn.dis:hover{ background:linear-gradient(180deg,rgba(52,46,40,.92),rgba(34,30,26,.94)); color:#8a8073; cursor:not-allowed; }

#itemTooltip{ position:fixed; background:rgba(30,24,22,.96); border:1px solid rgba(232,176,75,.5);
  color:var(--text-main); padding:8px 11px; border-radius:6px; font-size:12px; pointer-events:none;
  z-index:2000; display:none; line-height:1.55; box-shadow:0 8px 24px rgba(0,0,0,.8); min-width:120px; }
#itemTooltip .tl{ white-space:nowrap; }
#itemTooltip .tl.nm{ color:var(--warm-gold); font-weight:bold; }
#itemTooltip .tl.cat{ color:#aaa; }
/* 类名不用 .pig：右栏色素条的 .pig 是竖排，同名会把这一行也变成竖排居中 */
#itemTooltip .tl.tip-pig{ display:flex; flex-direction:row; flex-wrap:wrap; justify-content:flex-start; gap:3px 9px; align-items:center; text-align:left; }
#itemTooltip .tl.tip-pig .none{ color:#aaa; }
#itemTooltip .tl.tip-pig .cur{ font-weight:bold; }
</style>
</head>
<body>
<div id="itemTooltip" data-no-sync></div>

<div class="dye-system">

  <div class="col bag-col">
    <div class="col-t"><span data-i18n="bagTitle" id="bagTitleText">背包</span><span class="r" id="bagInfo">0/42</span></div>
    <div class="bag-tabs" id="bagTabs">
      <div class="bag-tab-pinned-slot" id="bagTabPinned"></div>
      <button class="tab-scroll-btn" id="tabScrollLeft" type="button" aria-label="向左">&lsaquo;</button>

  <div class="col vat-col">
    <div class="col-t has-help"><span data-i18n="vatTitle">染料桶</span><button class="hq" id="helpBtn" type="button">?</button><span class="r" id="vatInfo">0/36</span>
      <div class="help-pop" id="helpPop" hidden><div class="hp-t" id="helpTitle"></div><ul id="helpList"></ul></div>
    </div>

      <div class="hoop top"></div><div class="hoop bot"></div>

      <div class="vat-in">
        <div class="grid-container" id="vatGrid"></div>
        <div class="wash" id="vatWash"></div>
        <div class="bubbles" id="bubbles" data-no-sync></div>

    <svg class="funnel" viewBox="0 0 96 24"><path id="funnelPath" d="M1 1 H95 L56 17 V23 H40 V17 Z" fill="#ffffff" fill-opacity="0.04" stroke="rgba(255,255,255,.13)" stroke-width="1" stroke-linejoin="round"/></svg>

      <div class="cap"><span data-i18n="pickTitle">提取颜色</span></div>
      <div class="dd" id="pick">
        <button class="dd-btn" id="pickBtn" type="button"></button>
        <div class="dd-list" id="pickList"></div>
      </div>
      <div class="sep"></div>
      <div class="cap"><span data-i18n="productTitle">产物</span></div>
      <div class="prod" id="prod"></div>
      <div class="sep"></div>
      <div class="cap"><span data-i18n="pigmentTitle">色素</span><span class="r" id="perBucket"></span></div>
      <div class="pig" id="pig"></div>
    </div>
    <div class="tsec">
      <div class="tline"><span id="tLabel"></span><span class="v" id="tNum"></span></div>
      <div class="timebar"><div class="timebar-fill" id="tFill"></div></div>
      <div class="note" id="note"></div>

        <button class="btn dis" id="btnGo" type="button"></button>
        <button class="btn take dis" id="btnTake" type="button"></button>
      </div>
    </div>
  </div>

</div>

<script>
var core = createWebUICore('DyePanel');

/* 词条未入 ConstantText 时 C# 侧回传空串，这里的中文兜底生效。模板里的 {0}{1}{2} 由 tpl() 替换 */
var i18nText = {
  pageTitle:'染料桶', bagTitle:'背包', vatTitle:'染料桶', slotTitle:'原料槽', shelfTitle:'成品',
  dyeTitle:'染色', productTitle:'产物', pigmentTitle:'色素', perBucketTemplate:'每 {0} 点一桶',
  stEmpty:'空', stIdle:'未开工', stRunning:'染色中 · 已锁定', stDone:'本批完成',
  emptySub:'放入植物后显示能做出的颜色', pigmentEmpty:'放入植物后显示',
  noneName:'提取不出色素', noneSub:'槽里没有已解锁颜色的色素',
  tieName:'颜色不纯', tieSub:'{0}一样多', tieNote:'加减一些原料，让其中一种最多',
  shortSub:'{0} {1} / {2} 点', shortNote:'{0}色素还差 {1} 点才够一桶',
  extraNote:'多出 {0} 点{1}色素用不上', idleNote:'不参与：{0}',
  runningSub:'第 {0} 桶制作中', doneSub:'本批完成', lockedNote:'原料槽已锁定',
  totalRemainNote:'全部完成还需 {0}', doneNote:'取空成品架后可开始下一批',
  timePerBucket:'每桶 {0}', timeEstimate:'预计用时', timeBucketRemain:'本桶剩余', timeDone:'本批完成',
  shelfWill:'将出 {0} 桶', shelfNext:'下一桶 {0}/{1}', shelfAvail:'{0} 可取 · 已取 {1}/{2}',
  btnStart:'开始染色', btnRunning:'染色中', btnTakeAll:'全部取出', takeOneTip:'取出一桶',
  shiftHint:'右键 / Shift+点击 快速转移',
  pickTitle:'提取颜色', pickAuto:'未选择',
  tiePick:'在上面选一种颜色，或加减原料让其中一种最多',
  pigmentUndiscovered:'当前还没发现', listSep:'、',
  helpTitle:'染料桶规则',
  help1:'原料槽仅接收植物，不同植物含有不同颜色的色素。',
  help2:'默认提取含量最高的颜色，也可手动选定颜色。',
  help3:'仅已解锁的颜色可以提取，收获花卉或阅读《植物染手记》可解锁更多颜色。',
  moldyLabel:'已经发霉', shelfLifeLabel:'保质期:', unitDay:'天', unitHour:'时'
};

/* 批次状态与出色预判常量，与 DyeComponent.STATE_* / DyePanelData.PREVIEW_* 同口径 */
var ST_IDLE = 0, ST_RUNNING = 1, ST_DONE = 2;
var PV_EMPTY = 0, PV_NONE = 1, PV_TIE = 2, PV_SHORT = 3, PV_OK = 4;
var MARK_HIT = 1, MARK_IDLE = 2;

var State = {
  bagOwnerId:0, bagCols:6, bagRows:7, bagItems:[], furnitureName:'',
  bagTabs:[], bagIsFreezing:false, bagIsPowered:false, bagFrozen:false,
  vatOwnerId:0, vatCols:6, vatRows:6, vatItems:[],
  state:0, locked:false, canStart:false, previewState:0,
  resultItemId:0, resultName:'', resultColor:'', resultColorName:'',
  bucketCount:0, mainPoints:0, extraPoints:0, lackPoints:0, pointsPerBucket:24, hoursPerBucket:72,
  previewTotalHours:0, shelfCapacity:18, doneCount:0, takenCount:0, availableCount:0,
  bucketProgress:0, bucketRemainSec:0, totalRemainSec:0, pigments:[], tieNames:[],
  targetDyeId:0, unlockMask:0, palette:[]
};

var $ = function(id){ return document.getElementById(id); };

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function tpl(s){
  var r = String(s || '');
  for (var i = 1; i < arguments.length; i++) r = r.split('{' + (i - 1) + '}').join(arguments[i]);
  return r;
}
function fmtH(h){
  h = Math.max(0, Math.ceil(h));
  var d = Math.floor(h/24), r = h%24;
  var D = i18nText.unitDay, H = i18nText.unitHour;
  return (d && r) ? (d+D+' '+r+H) : (d ? (d+D) : (r+H));
}
function fmtSec(sec){ return fmtH(Math.max(0, sec) / 3600); }
function findItem(list, itemId){
  for (var i=0;i<list.length;i++){ if (list[i].itemId == itemId) return list[i]; }
  return null;
}
function parseJsonArray(s){
  if (!s) return [];
  try { var v = JSON.parse(s); return Array.isArray(v) ? v : []; } catch (e) { return []; }
}

/* 原料槽拒收的原因走 Unity 全局飘字（与右键 / Shift+点击同一套判据和文案），面板里不再写红字 */
function rejectHint(itemData){
  var r = itemData && itemData._raw || {};
  var id = parseInt(r.itemId || (itemData && itemData.id), 10) || 0;
  if (id > 0) core.UnitySendEvent('DYE_REJECT', { itemId: id });
}

/* 色素 = 一滴水滴（扁平描边 + 一道高光） */
/* 空心水滴：悬浮提示「当前还没发现」一行用 */
function dropOutlineSvg(){
  return '<span class="drop"><svg viewBox="0 0 12 16"><path d="M6 .8C4.2 3.6 1 7.4 1 10.4a5 5 0 0 0 10 0C11 7.4 7.8 3.6 6 .8Z" fill="none" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="2 1.4"/></svg></span>';
}
function dropSvg(color){
  return '<span class="drop"><svg viewBox="0 0 12 16"><path d="M6 .8C4.2 3.6 1 7.4 1 10.4a5 5 0 0 0 10 0C11 7.4 7.8 3.6 6 .8Z" fill="' + esc(color) +
         '" stroke="rgba(0,0,0,.5)" stroke-width=".8"/><path d="M3.5 10.3a2.6 2.6 0 0 0 1.7 2.5" stroke="rgba(255,255,255,.6)" stroke-width="1" fill="none" stroke-linecap="round"/></svg></span>';
}

/* 桶：带提梁的油漆桶。桶身梯形 + 弧形桶底 + 双层桶口（外沿 + 内口），桶身不画箍线；
   桶身半透明、能看到液面（level ∈ [0,1]），左侧一道高光 / 右侧一道暗面给出圆柱体积，满桶时桶口溢出一道漆滴。
   产物大桶与成品小桶共用；o.h = 显示高度（px），线宽与虚线按显示尺寸换算成固定像素 */
var OK_STROKE = 'rgba(127,174,98,.92)', RUN_STROKE = 'rgba(232,176,75,.85)', GREY_STROKE = 'rgba(198,208,218,.45)';
var BK_BODY = 'M5 8H35L31.5 40A11.5 2.9 0 0 1 8.5 40Z';
function bucketSvg(o){
  var st = o.stroke || 'rgba(198,208,218,.32)', so = o.so == null ? 1 : o.so, op = o.op == null ? 1 : o.op;
  var u = 44 / (o.h || 66), sw = (1.2 * u).toFixed(3), hw = (1 * u).toFixed(3);
  var dash = o.dashed ? ' stroke-dasharray="' + (3 * u).toFixed(2) + ' ' + (2.2 * u).toFixed(2) + '"' : '';
  var line = ' stroke="' + st + '" stroke-opacity="' + so + '" stroke-width="' + sw + '" stroke-linejoin="round"' + dash;
  var thin = ' fill="none" stroke="' + st + '" stroke-opacity="' + (so * .6) + '" stroke-width="' + hw + '"';
  var lv = o.color ? Math.max(0, Math.min(1, o.level || 0)) : 0, full = lv >= 1;
  var size = o.h ? ' style="width:' + (o.h * 40 / 44).toFixed(1) + 'px;height:' + o.h.toFixed(1) + 'px"' : '';
  /* 提梁：画在桶口后面，两端各一个耳扣 */
  var h = '<svg viewBox="0 0 40 44"' + size + '><path d="M6.4 11.2C6.4 2.6 12.4 .8 20 .8S33.6 2.6 33.6 11.2" fill="none"' + line + ' stroke-linecap="round"/>';
  if (!o.dashed) h += '<ellipse cx="20" cy="41" rx="14" ry="2.4" fill="#000" fill-opacity=".35"/>';
  h += '<path d="' + BK_BODY + '" fill="rgba(0,0,0,.35)"/>';
  if (lv > 0){
    /* 液体：上沿是液面椭圆的后半弧，和桶身同一透视（ry 随液面宽度等比） */
    var y = 40 - lv * 32, k = 3.5 / 32, xl = 5 + (y - 8) * k, xr = 35 - (y - 8) * k, rx = (xr - xl) / 2, ry = 3.8 * rx / 15;
    h += '<path d="M' + xl.toFixed(2) + ' ' + y.toFixed(2) + 'A' + rx.toFixed(2) + ' ' + ry.toFixed(2) + ' 0 0 1 ' + xr.toFixed(2) + ' ' + y.toFixed(2) +
         'L31.5 40A11.5 2.9 0 0 1 8.5 40Z" fill="' + o.color + '" fill-opacity="' + op + '"/>';
    if (!full) h += '<ellipse cx="20" cy="' + y.toFixed(2) + '" rx="' + rx.toFixed(2) + '" ry="' + ry.toFixed(2) + '" fill="#fff" fill-opacity=".2"/>';
  }
  /* 圆柱体积：左高光、右暗面（虚线占位桶不画，保持「空位」的轻） */
  if (!o.dashed) h += '<path d="M8.4 11.6L11 12.1L12.6 41.3L10.8 40.9Z" fill="#fff" fill-opacity=".1"/>' +
                      '<path d="M30.6 12L34.6 11.1L31.4 40.2L28.8 40.9Z" fill="#000" fill-opacity=".22"/>';
  h += '<path d="' + BK_BODY + '" fill="none"' + line + '/>';
  /* 桶口：外沿一圈 + 内口；满桶时内口就是液面，带一点反光 */
  h += '<ellipse cx="20" cy="8" rx="15" ry="3.8" fill="rgba(255,255,255,.07)"' + line + '/>';
  h += '<circle cx="6.4" cy="11.4" r="1.2" fill="' + st + '" fill-opacity="' + so + '"/><circle cx="33.6" cy="11.4" r="1.2" fill="' + st + '" fill-opacity="' + so + '"/>';
  h += '<ellipse cx="20" cy="8.3" rx="13.2" ry="2.9" fill="' + (full ? o.color : 'rgba(0,0,0,.6)') + '" fill-opacity="' + (full ? op : 1) + '"' + thin + '/>';
  if (full){
    h += '<ellipse cx="15" cy="7.5" rx="4.2" ry=".9" fill="#fff" fill-opacity=".3"/>';
    /* 漆顺着桶沿淌下来一道 */
    h += '<path d="M25.6 10.9C25.6 13 25.4 14.6 25.4 16.1A1.35 1.35 0 0 0 28.1 16.1C28.1 14.4 27.9 12.8 27.9 10.6Z" fill="' + o.color + '" fill-opacity="' + op + '" stroke="#000" stroke-opacity=".35" stroke-width="' + (.6 * u).toFixed(3) + '"/>' +
         '<path d="M26.1 12.2V15.4" stroke="#fff" stroke-opacity=".35" stroke-width="' + (.7 * u).toFixed(3) + '" stroke-linecap="round"/>';
  }
  if (o.text) h += '<text x="20" y="31" text-anchor="middle" font-family="Consolas,monospace" font-size="15" font-weight="700" fill="rgba(255,255,255,.45)">' + o.text + '</text>';
  return h + '</svg>';
}

/* ══════ 背包与原料槽 ══════ */
var bagBag = createGridBag('bagGrid', { cols:6, rows:7, slotSize:38, gap:5, padding:9, onItemRendered:paintBagItem });
var vatBag = createGridBag('vatGrid', { cols:6, rows:6, slotSize:38, gap:5, padding:9, onItemRendered:paintVatItem });

function paintCommonMarks(el, r){
  if (r.isExpired){
    el.classList.add('expired');
    var mask = document.createElement('div'); mask.className='expired-mask'; el.appendChild(mask);
  } else if (r.nearExpiry){
    var nearMask = document.createElement('div'); nearMask.className='near-expiry-mask'; el.appendChild(nearMask);
  }
  if (r.polluted){
    var ring = document.createElement('div'); ring.className='polluted-ring'; el.appendChild(ring);
  }
  if (r.actionMark > 0){
    el.classList.add('in-action');
    if (r.actionMark === 2) el.classList.add('using');
    var glow = document.createElement('div'); glow.className='action-glow'; el.appendChild(glow);
  }
}
/* 物品每个给这种染料多少点（pigments 只含已解锁颜色；0 = 不含） */
function itemDyePoints(r, dyeId){
  if (!dyeId || !r || !r.pigments) return 0;
  var pig = parseJsonArray(r.pigments);
  for (var i = 0; i < pig.length; i++){ if (pig[i].d === dyeId) return pig[i].p || 0; }
  return 0;
}
function itemHasDye(r, dyeId){
  if (!dyeId || !r || !r.pigments) return false;
  var pig = parseJsonArray(r.pigments);
  for (var i = 0; i < pig.length; i++){ if (pig[i].d === dyeId) return true; }
  return false;
}
/* 左栏当前颜色：选了 = 所选颜色；没选 = 原料槽含量最多的颜色（产物按它出，并列 / 提取不出时没有）；染色中不描 */
function bagWantDye(){
  if (State.state === ST_RUNNING) return 0;
  if (State.targetDyeId > 0) return State.targetDyeId;
  return State.state === ST_IDLE && (State.previewState === PV_OK || State.previewState === PV_SHORT) ? State.resultItemId : 0;
}
/* 当前颜色描边 + 右下角「水滴 + 点数」（点数取不到时只描边） */
function paintWant(el, r, dyeId, color){
  el.classList.add('dye-want');
  el.style.setProperty('--want', color);
  var pts = itemDyePoints(r, dyeId);
  if (pts > 0){
    var b = document.createElement('div');
    b.className = 'dye-pts';
    b.innerHTML = dropSvg(color) + pts;
    el.appendChild(b);
  }
}
/* 左栏里含当前颜色的植物描一圈该色、标出点数 */
function paintBagItem(el, item){
  var r = item._raw || {};
  var d = bagWantDye(), tc = d ? paletteEntry(d) : null;

/* ══════ 成品架 ══════
   只摆本批的桶，并铺满成品框：桶数一变就重算行列，桶越多每只越小。
   开工前：每满一桶摆一只（细实线 + 淡液面），凑不满的余数摆成下一只半桶；槽空留一只虚线空桶。
   开工后：可取（满桶绿边，点击取出）→ 制作中（液面随进度上涨）→ 待出（虚线）；取走的从架上消失。 */
var PLANK = 3, ROW_GAP = 4, COL_GAP = 2, PREV_OP = 0.3;
function shelfLayout(n, W, H){
  var best = null;
  for (var r = 1; r <= n; r++){
    var cols = Math.ceil(n / r);
    if (Math.ceil(n / cols) !== r) continue;
    var w = (W - (cols - 1) * COL_GAP) / cols;
    var h = Math.min(w * 44 / 40, (H - r * PLANK - (r - 1) * ROW_GAP) / r);
    if (!best || h > best.h + 0.01) best = { r:r, cols:cols, w:w, h:h };
  }
  return best;
}
function renderShelf(){
  var cells = [], info = '', i;
  var per = State.pointsPerBucket || 24;
  if (State.state !== ST_IDLE){
    var c = State.resultColor, avail = State.availableCount;
    for (i = 0; i < avail; i++) cells.push({ cls:'done', take:true, o:{ color:c, level:1, stroke:OK_STROKE } });
    if (State.state === ST_RUNNING){
      var remainDays = Math.ceil(State.bucketRemainSec / 86400);
      cells.push({ o:{ color:c, level:State.bucketProgress, op:0.85, stroke:RUN_STROKE }, t: remainDays + i18nText.unitDay });
      for (i = State.doneCount + 1; i < State.bucketCount; i++) cells.push({ o:{ dashed:true, stroke:c, so:0.7 } });
    }
    info = tpl(i18nText.shelfAvail, avail, State.takenCount, State.bucketCount);
  } else if (State.previewState === PV_OK || State.previewState === PV_SHORT){
    var pc = State.resultColor;
    var full = State.previewState === PV_OK ? State.bucketCount : 0;
    var rest = State.previewState === PV_OK ? State.extraPoints : (per - State.lackPoints);
    for (i = 0; i < full; i++) cells.push({ o:{ stroke:pc, so:0.55, color:pc, level:1, op:PREV_OP } });
    if (rest > 0 && full < State.shelfCapacity) cells.push({ o:{ stroke:GREY_STROKE, color:pc, level:rest / per, op:PREV_OP } });
    var parts = [];
    if (full) parts.push(tpl(i18nText.shelfWill, full));
    if (rest) parts.push(tpl(i18nText.shelfNext, rest, per));
    info = parts.join(' · ');
  }
  if (!cells.length){
    /* 槽空（选了颜色时桶框描成该色）/ 提取不出 / 并列：留一只虚线空桶 */
    cells.push({ o:{ dashed:true, stroke:(State.previewState === PV_EMPTY && State.resultColor) || GREY_STROKE, so:0.7 } });
  }

  var box = $('shelf');
  var L = shelfLayout(cells.length, box.clientWidth, box.clientHeight);
  var html = '';
  if (L){
    for (var r = 0; r < L.r; r++){
      html += '<div class="shelf-row" style="gap:' + COL_GAP + 'px">';
      var rowCells = cells.slice(r * L.cols, (r + 1) * L.cols);
      for (var k = 0; k < rowCells.length; k++){
        var x = rowCells[k];
        x.o.h = L.h;
        html += '<div class="bk' + (x.cls ? ' ' + x.cls : '') + '"' + (x.take ? ' data-take="1" title="' + esc(i18nText.takeOneTip) + '"' : '') +
                ' style="width:' + L.w.toFixed(1) + 'px;height:' + L.h.toFixed(1) + 'px">' + bucketSvg(x.o) +
                (x.t ? '<span class="t" style="font-size:' + Math.max(10, Math.round(L.h * 0.22)) + 'px">' + esc(x.t) + '</span>' : '') + '</div>';
      }
      html += '</div>';
    }
  }
  box.innerHTML = html;
  $('shelfInfo').textContent = info;
}
$('shelf').addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-take]') : null;
  if (t) core.UnitySendEvent('DYE_HARVEST', { count: 1 });
});

/* ══════ 产物与色素 ══════ */
function idleNames(){
  var cnt = {}, order = [];
  for (var i = 0; i < State.vatItems.length; i++){
    var it = State.vatItems[i];
    if (it.dyeMark !== MARK_IDLE) continue;
    var n = it.name || '';
    if (!(n in cnt)){ cnt[n] = 0; order.push(n); }
    cnt[n] += it.count || 1;
  }
  return order.map(function(n){ return n + ' ×' + cnt[n]; }).join(i18nText.listSep);
}
function info(nm, x, sub){
  return '<div class="info"><div class="nm">' + esc(nm) + '</div>' + (x ? '<div class="x">' + x + '</div>' : '') +
         (sub ? '<div class="sub">' + esc(sub) + '</div>' : '') + '</div>';
}
function renderProd(){
  var p = '', note = '', tl = tpl(i18nText.timePerBucket, fmtH(State.hoursPerBucket)), tn = '', fill = 0, fillDone = false, dim = false;
  var s = State, c = s.resultColor, per = s.pointsPerBucket || 24;
  var X = '<span class="s">×</span>';
  if (s.state === ST_RUNNING){
    p = bucketSvg({ color:c, level:1, stroke:RUN_STROKE }) + info(s.resultName, (s.doneCount + 1) + '<span class="s">/</span>' + s.bucketCount, tpl(i18nText.runningSub, s.doneCount + 1));
    tl = i18nText.timeBucketRemain; tn = fmtSec(s.bucketRemainSec); fill = s.bucketProgress;
    note = esc(tpl(i18nText.totalRemainNote, fmtSec(s.totalRemainSec))) + '<br>' + esc(i18nText.lockedNote);
  } else if (s.state === ST_DONE){
    p = bucketSvg({ color:c, level:1, stroke:OK_STROKE }) + info(s.resultName, X + s.bucketCount, i18nText.doneSub);
    tl = i18nText.timeDone; fill = 1; fillDone = true;
    note = esc(i18nText.doneNote);
  } else if (s.previewState === PV_EMPTY && s.resultItemId > 0){
    /* 选了颜色、槽还空着：显示所选颜色 0 / 24 */
    p = bucketSvg({ dashed:true, stroke:c }) + info(s.resultName, '', tpl(i18nText.shortSub, s.resultColorName, 0, per));
  } else if (s.previewState === PV_EMPTY){
    p = bucketSvg({ dashed:true }) + info('—', '', i18nText.emptySub); dim = true;
  } else if (s.previewState === PV_NONE){
    p = bucketSvg({ dashed:true, text:'?' }) + info(i18nText.noneName, '', i18nText.noneSub); dim = true;
  } else if (s.previewState === PV_TIE){
    p = bucketSvg({ dashed:true, text:'?' }) + info(i18nText.tieName, '', tpl(i18nText.tieSub, s.tieNames.join(i18nText.listSep)));
    note = '<span class="bad">' + esc(i18nText.tiePick) + '</span>';
  } else if (s.previewState === PV_SHORT){
    var pts = per - s.lackPoints;
    p = bucketSvg({ color:c, level:pts / per, op:0.85 }) + info(s.resultName, X + '0', tpl(i18nText.shortSub, s.resultColorName, pts, per));
    note = '<span class="bad">' + esc(tpl(i18nText.shortNote, s.resultColorName, s.lackPoints)) + '</span>';
  } else {
    p = bucketSvg({ color:c, level:1 }) + info(s.resultName, X + s.bucketCount, '');
    tl = i18nText.timeEstimate; tn = fmtH(s.previewTotalHours);
    var bits = [];
    if (s.extraPoints) bits.push('<span class="warn-t">' + esc(tpl(i18nText.extraNote, s.extraPoints, s.resultColorName)) + '</span>');
    var idle = idleNames();
    if (idle) bits.push(esc(tpl(i18nText.idleNote, idle)));
    note = bits.join('<br>');
  }
  var pe = $('prod');
  pe.innerHTML = p;
  pe.classList.toggle('dim', dim);
  $('tLabel').textContent = tl;
  $('tNum').textContent = tn;
  var f = $('tFill');
  f.style.transform = 'scaleX(' + Math.max(0, Math.min(1, fill)).toFixed(3) + ')';
  f.classList.toggle('done', fillDone);
  $('note').innerHTML = note;
}

/* 色素条：只有本批要提取的那一种颜色（选了 = 所选颜色；没选 = 含量最多的；没选且并列 = 并列的几种）；
   每满一桶一道刻度 */
function renderPig(){
  var list = State.pigments || [];
  var per = State.pointsPerBucket || 24;
  $('perBucket').textContent = tpl(i18nText.perBucketTemplate, per);
  var el = $('pig');
  if (!list.length){
    el.innerHTML = State.previewState === PV_EMPTY && State.state === ST_IDLE
      ? '<div class="pig-empty">' + esc(i18nText.pigmentEmpty) + '</div>' : '';
    return;
  }
  var max = per * 2;
  for (var i = 0; i < list.length; i++) max = Math.max(max, list[i].points);
  var tick = (per / max * 100).toFixed(3);
  var html = '';
  for (var j = 0; j < list.length; j++){
    var p = list[j];
    html += '<div class="pr' + (p.isMain ? ' main' : '') + '"><span class="nmc">' + dropSvg(p.color) + esc(p.name) + '</span>' +
            '<span class="bar"><i style="transform:scaleX(' + (p.points / max).toFixed(4) + ');background:' + esc(p.color) + '"></i>' +
            '<b style="background-image:linear-gradient(to right,transparent calc(100% - 1px),rgba(255,255,255,.4) 0);background-size:' + tick + '% 100%"></b></span>' +
            '<span class="v">' + p.points + '</span></div>';

/* ══════ 选色（下拉） ══════
   只列已解锁颜色（色位序），没有「不选」项：没选过时按钮写「未选择」、按槽里含量最多的颜色出，选过就一直有选色。
   颜色会继续加，列表限高滚动。空闲时可展开；染色中 / 本批完成时锁住，按钮只显示本批颜色（颜色开工时已定死）。
   展开时点下拉以外任何地方 = 只收起下拉（这一下不再触发「点空白关面板」）。 */
var _pickOpen = false, _pickSwallowClick = false;
function paletteEntry(d){
  for (var i = 0; i < State.palette.length; i++){ if (State.palette[i].d === d) return State.palette[i]; }
  return null;
}
function pickLabel(c){
  return c ? dropSvg(c.c) + '<span class="t">' + esc(c.n) + '</span>'
           : dropOutlineSvg() + '<span class="t">' + esc(i18nText.pickAuto) + '</span>';
}
function renderPick(){
  var box = $('pick'), idle = State.state === ST_IDLE;
  var cur = paletteEntry(idle ? State.targetDyeId : State.resultItemId);
  if (!idle) _pickOpen = false;
  box.classList.toggle('off', !idle);
  box.classList.toggle('open', _pickOpen);
  box.classList.toggle('sel', !!cur);
  box.style.setProperty('--pc', cur ? cur.c : 'rgba(255,255,255,.4)');
  $('pickBtn').innerHTML = pickLabel(cur);
  if (!_pickOpen){ $('pickList').innerHTML = ''; return; }
  var html = '';
  for (var i = 0; i < State.palette.length; i++){
    var c = State.palette[i];
    if (!(State.unlockMask & (1 << i))) continue;
    html += '<div class="dd-it' + (cur && c.d === cur.d ? ' on' : '') + '" data-dye="' + c.d + '" style="--pc:' + esc(c.c) + '">' +
            pickLabel(c) + '</div>';
  }
  $('pickList').innerHTML = html;
}
function hasUnlockedColor(){
  for (var i = 0; i < State.palette.length; i++){ if (State.unlockMask & (1 << i)) return true; }
  return false;
}
function setPickOpen(v){
  /* 一种颜色都没解锁时列表是空的，不展开 */
  _pickOpen = !!v && State.state === ST_IDLE && hasUnlockedColor();
  renderPick();
  if (_pickOpen){
    var on = $('pickList').querySelector('.dd-it.on');
    if (on && on.scrollIntoView) on.scrollIntoView({ block: 'nearest' });
  }
}
$('pickBtn').addEventListener('click', function(){ setPickOpen(!_pickOpen); });
$('pickList').addEventListener('click', function(e){
  var t = e.target && e.target.closest ? e.target.closest('[data-dye]') : null;
  if (!t || State.state !== ST_IDLE) return;
  var d = parseInt(t.getAttribute('data-dye'), 10) || 0;
  setPickOpen(false);
  if (d !== State.targetDyeId) core.UnitySendEvent('DYE_SELECT', { dyeItemId: d });
});
document.addEventListener('mousedown', function(e){
  _pickSwallowClick = false;
  if (!_pickOpen || $('pick').contains(e.target)) return;
  _pickSwallowClick = true;
  setPickOpen(false);
}, true);

function applyFrozenClass(){ $('bagGrid').classList.toggle('is-frozen', !!State.bagFrozen); }

/* ══════ Unity → 前端 ══════ */
var STATE_FIELDS = ['state','locked','canStart','previewState','resultItemId','resultName','resultColor','resultColorName',
  'bucketCount','mainPoints','extraPoints','lackPoints','pointsPerBucket','hoursPerBucket','previewTotalHours',
  'shelfCapacity','doneCount','takenCount','availableCount','bucketProgress','bucketRemainSec','totalRemainSec'];

core.registerHandlers({
  'WebUI_Dye_BagMsg': function(data){
    if (data.bagOwnerId !== undefined){ State.bagOwnerId=data.bagOwnerId; bagBag.setOwnerId(data.bagOwnerId||0); }
    if (data.vatOwnerId !== undefined){ State.vatOwnerId=data.vatOwnerId; vatBag.setOwnerId(data.vatOwnerId||0); }
    if (data.bagCols !== undefined){ State.bagCols=data.bagCols; State.bagRows=data.bagRows; bagBag.resize(data.bagCols, data.bagRows); }
    if (data.vatCols !== undefined){ State.vatCols=data.vatCols; State.vatRows=data.vatRows; vatBag.resize(data.vatCols, data.vatRows); }
    if (data.furnitureName !== undefined) State.furnitureName = data.furnitureName || '';
    if (data.bagTabs !== undefined) State.bagTabs = data.bagTabs || [];

    var prevFrozen = State.bagFrozen;
    if (data.bagIsFreezing !== undefined) State.bagIsFreezing = !!data.bagIsFreezing;
    if (data.bagIsPowered !== undefined) State.bagIsPowered = !!data.bagIsPowered;
    State.bagFrozen = State.bagIsFreezing && State.bagIsPowered;
    applyFrozenClass();

    if (data.bagItems !== undefined){ State.bagItems=data.bagItems||[]; bagBag.refresh(State.bagItems); }
    else if (prevFrozen !== State.bagFrozen) bagBag.renderItems();
    if (data.vatItems !== undefined){ State.vatItems=data.vatItems||[]; vatBag.refresh(State.vatItems); }
    renderBagTabs(); syncBagTitle();
    updateBagInfo();
    /* 桶口「空 / 未开工」与「不参与：…」随原料槽内容变化 */
    renderVat(); renderProd();
  },
  'WebUI_Dye_StateMsg': function(data){
    var prevWant = bagWantDye();
    var prevVatColor = State.resultColor, prevVatDye = State.resultItemId;
    for (var i = 0; i < STATE_FIELDS.length; i++){
      var k = STATE_FIELDS[i];
      if (data[k] !== undefined) State[k] = data[k];
    }
    if (data.pigments !== undefined) State.pigments = data.pigments || [];
    if (data.tieNames !== undefined) State.tieNames = parseJsonArray(data.tieNames);
    if (data.unlockMask !== undefined) State.unlockMask = data.unlockMask | 0;
    if (data.palette !== undefined) State.palette = parseJsonArray(data.palette);
    /* 左栏高亮随选色 / 批次状态变：变了就重画左栏物品 */
    if (data.targetDyeId !== undefined) State.targetDyeId = data.targetDyeId | 0;
    renderAll();
    if (prevWant !== bagWantDye()) bagBag.renderItems();
    /* 原料槽描边色 / 点数跟本批颜色走；参与标记随物品消息到，颜色随本消息到，先后不定，颜色变了就重画一次 */
    if (prevVatColor !== State.resultColor || prevVatDye !== State.resultItemId) vatBag.renderItems();
  },
  'WebUI_Dye_LocalizationMsg': function(data){
    if (!data) return;
    Object.keys(data).forEach(function(k){ if (data[k]) i18nText[k] = data[k]; });
    if (data.pageTitle) document.title = data.pageTitle;
    ['bagTitle','vatTitle','slotTitle','shelfTitle','dyeTitle','productTitle','pigmentTitle','shiftHint','pickTitle'].forEach(function(k){
      if (data[k]) core.i18n.updateText('[data-i18n="'+k+'"]', data[k]);
    });
    renderAll(); renderBagTabs(); syncBagTitle(); renderHelp();
  }
});

/* 「?」说明卡：再点按钮或点卡外收起；卡开着时点卡外只收起卡，这一下不算点空白关面板 */
var HELP_KEYS = ['help1','help2','help3'];
var _helpDismiss = false;
function renderHelp(){
  document.getElementById('helpTitle').textContent = i18nText.helpTitle;
  document.getElementById('helpList').innerHTML = HELP_KEYS.map(function(k){ return '<li>' + esc(i18nText[k]) + '</li>'; }).join('');
}
function setHelp(open){
  document.getElementById('helpPop').hidden = !open;
  document.getElementById('helpBtn').classList.toggle('on', open);
}
document.getElementById('helpBtn').addEventListener('click', function(){ setHelp(document.getElementById('helpPop').hidden); });
document.addEventListener('mousedown', function(e){
  _helpDismiss = false;
  var pop = document.getElementById('helpPop');
  if (pop.hidden || pop.contains(e.target) || document.getElementById('helpBtn').contains(e.target)) return;
  setHelp(false);
  _helpDismiss = true;
}, true);

/* 点空白关面板。[坑] 必须带 mousedown 守卫：click 的 target 是「按下」与「松开」的最近公共祖先，
   拖一个被吞掉 mousedown 的物品会合成出 target=空白容器的 click，面板凭空关掉。 */
function isBlankTarget(t){
  return !!t && (t === document.body || (t.classList && t.classList.contains('dye-system')));
}
var _blankMouseDown = false;
document.addEventListener('mousedown', function(e){ _blankMouseDown = isBlankTarget(e.target); }, true);
document.body.addEventListener('click', function(e){
  if (_helpDismiss){ _helpDismiss = false; return; }
  if (!_blankMouseDown) return;
  if (_pickSwallowClick) return;
  if (isBlankTarget(e.target)){
    core.UnitySendEvent('CLOSE', {});
  }
});

renderAll(); renderBagTabs(); renderHelp();
core.notifyReady();
</script>
</body>
</html>
