<div id="sr2">
  <style>
    #sr2 {
      --g-bg: #0d0d0f;
      --g-panel: #1d1a18;
      --g-panel-2: #232027;
      --g-rail: linear-gradient(180deg, rgba(38,37,42,.94), rgba(22,22,26,.97));
      --g-line: rgba(255,255,255,.10);
      --g-line-2: rgba(255,255,255,.18);
      --g-text: #ece5d8;
      --g-muted: #a89f92;
      --g-dim: #7a7268;
      --g-gold: #f0b03c;
      --g-gold-t: #ffe1a0;
      --g-green: #8fc06e;
      --g-blue: #7aa2d6;
      --g-pink: #d68ab8;
      --g-cyan: #6fc7c9;
      --g-orange: #e8a33d;
      --g-red: #e07a5f;
      width: 100%;
    }
    #sr2 .sr2-fitwrap { position: relative; width: 100%; overflow: hidden; }
    #sr2 .sr2-stage {
      position: relative;
      width: 1536px;
      height: 864px;
      transform-origin: top left;
      background: radial-gradient(130% 130% at 50% 0%, #262119 0%, #141215 55%, #0c0c0e 100%);
      border: 1px solid rgba(255,255,255,.10);
      border-radius: 14px;
      box-shadow: 0 24px 60px rgba(0,0,0,.5);
      color: var(--g-text);
      font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
    }
    #sr2 .sr2-stage *,
    #sr2 .sr2-stage *::before,
    #sr2 .sr2-stage *::after { box-sizing: border-box; }
    #sr2 .sr2-stage button,
    #sr2 .sr2-stage input,
    #sr2 .sr2-stage select { font: inherit; color: inherit; }
    #sr2 .sr2-stage button { cursor: pointer; }
    #sr2 .sr2-topbar {
      position: relative;
      z-index: 3;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      height: 46px;
      padding: 0 16px;
      border-bottom: 1px solid var(--g-line);
      background: linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.012));
    }
    #sr2 .sr2-scenes { display: flex; align-items: center; gap: 6px; }
    #sr2 .sr2-accent {
      width: 4px; height: 18px; border-radius: 2px; margin-right: 4px;
      background: var(--g-gold); box-shadow: 0 0 10px rgba(240,176,60,.5);
    }
    #sr2 .sr2-scene {
      height: 30px; padding: 0 14px; border-radius: 8px;
      border: 1px solid transparent; background: transparent; color: var(--g-muted);
      font-size: 13px;
    }
    #sr2 .sr2-scene:hover { color: var(--g-text); background: rgba(255,255,255,.05); }
    #sr2 .sr2-scene.active {
      color: var(--g-gold-t);
      background: rgba(240,176,60,.14);
      border-color: rgba(240,176,60,.4);
    }
    #sr2 .sr2-top-right { display: flex; align-items: center; gap: 12px; }
    #sr2 .sr2-scale-badge {
      padding: 3px 9px; border-radius: 6px;
      border: 1px solid var(--g-line); background: rgba(0,0,0,.25);
      color: var(--g-muted); font-size: 11px; font-family: Consolas, monospace;
    }
    #sr2 .sr2-icon-btn {
      width: 28px; height: 28px; border-radius: 8px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); display: inline-flex; align-items: center; justify-content: center; padding: 0;
    }
    #sr2 .sr2-icon-btn:hover { color: var(--g-text); border-color: var(--g-line-2); }

    #sr2 .sr2-layout {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: flex-start;
      gap: 14px;
      padding: 14px;
      height: 818px;
    }

    /* ───────── 侧栏 ───────── */
    #sr2 .sr2-rail {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      max-height: 790px;
      padding: 12px;
      border: 1px solid var(--g-line);
      border-radius: 12px;
      background: var(--g-rail);
      box-shadow: 0 12px 34px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
    }
    #sr2 .sr2-rail-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    #sr2 .sr2-rail-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
    #sr2 .sr2-rail-sub { color: var(--g-muted); font-size: 11px; margin-top: 2px; }
    #sr2 .sr2-rail-sub b { color: var(--g-gold); font-weight: 500; }
    #sr2 .sr2-expand {
      display: inline-flex; align-items: center; gap: 5px;
      height: 26px; padding: 0 10px; border-radius: 7px; flex: 0 0 auto;
      border: 1px solid rgba(240,176,60,.35); background: rgba(240,176,60,.09);
      color: var(--g-gold); font-size: 12px; white-space: nowrap;
    }
    #sr2 .sr2-expand:hover { background: rgba(240,176,60,.18); }

    /* 容器选择：当前容器 + 固定收藏 + 全部下拉 */
    #sr2 .sr2-ctn-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
    #sr2 .sr2-ctn-cur {
      flex: 0 0 auto;
      display: inline-flex; align-items: center; gap: 7px;
      height: 30px; padding: 0 10px; border-radius: 8px;
      border: 1px solid rgba(240,176,60,.4); background: rgba(240,176,60,.10);
      color: var(--g-gold-t); font-size: 12px; white-space: nowrap;
    }
    #sr2 .sr2-ctn-cur:hover { background: rgba(240,176,60,.18); }
    #sr2 .sr2-ctn-cur .cc-dots { display: inline-flex; gap: 3px; }
    #sr2 .sr2-ctn-cur .cc-dot { width: 6px; height: 6px; border-radius: 50%; }
    #sr2 .sr2-pin-row {
      flex: 1 1 0; min-width: 0;
      display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none;
    }
    #sr2 .sr2-pin-row::-webkit-scrollbar { display: none; }
    #sr2 .sr2-pin {
      flex: 0 0 auto; height: 30px; padding: 0 9px; border-radius: 8px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); font-size: 11.5px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    #sr2 .sr2-pin:hover { color: var(--g-text); border-color: var(--g-line-2); }
    #sr2 .sr2-pin.active { color: var(--g-gold-t); border-color: rgba(240,176,60,.45); background: rgba(240,176,60,.12); }
    #sr2 .sr2-pin .p-dot { width: 5px; height: 5px; border-radius: 50%; }
    #sr2 .sr2-allctn {
      flex: 0 0 auto; height: 30px; padding: 0 9px; border-radius: 8px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); font-size: 11.5px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 4px;
    }
    #sr2 .sr2-allctn:hover { color: var(--g-text); border-color: var(--g-line-2); }

    #sr2 .sr2-search {
      display: flex; align-items: center; gap: 7px;
      height: 32px; margin-top: 8px; padding: 0 9px;
      border-radius: 8px; border: 1px solid var(--g-line);
      background: rgba(0,0,0,.26); color: var(--g-muted);
    }
    #sr2 .sr2-search input {
      flex: 1; min-width: 0; border: 0; outline: 0;
      background: transparent; color: var(--g-text); font-size: 12.5px;
    }
    #sr2 .sr2-search input::placeholder { color: var(--g-dim); }

    /* 标签：常用横排 + 更多面板 */
    #sr2 .sr2-tag-row { display: flex; align-items: center; gap: 5px; margin-top: 8px; }
    #sr2 .sr2-tags { display: flex; gap: 5px; flex: 0 0 auto; }
    #sr2 .sr2-tag {
      height: 25px; padding: 0 9px; border-radius: 999px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); font-size: 11.5px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    #sr2 .sr2-tag:hover { color: var(--g-text); border-color: var(--g-line-2); }
    #sr2 .sr2-tag.active { color: var(--g-gold-t); border-color: rgba(240,176,60,.45); background: rgba(240,176,60,.12); }
    #sr2 .sr2-tag .t-dot { width: 6px; height: 6px; border-radius: 50%; }
    #sr2 .sr2-tag-more {
      height: 25px; padding: 0 10px; border-radius: 999px; margin-left: auto;
      border: 1px dashed var(--g-line-2); background: rgba(255,255,255,.02);
      color: var(--g-muted); font-size: 11.5px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    #sr2 .sr2-tag-more:hover { color: var(--g-text); }
    #sr2 .sr2-tag-more.has { color: var(--g-gold-t); border-color: rgba(240,176,60,.5); border-style: solid; }
    #sr2 .sr2-more-badge {
      min-width: 15px; height: 15px; padding: 0 4px; border-radius: 8px;
      background: rgba(240,176,60,.25); color: var(--g-gold-t);
      font-size: 10px; line-height: 15px; text-align: center;
    }

    #sr2 .sr2-tools { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    #sr2 .sr2-sort {
      flex: 1; min-width: 0;
      display: flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 8px;
      border-radius: 8px; border: 1px solid var(--g-line);
      background: rgba(0,0,0,.26); color: var(--g-muted);
    }
    #sr2 .sr2-sort select {
      flex: 1; min-width: 0; height: 26px; border: 0; outline: 0;
      background: transparent; color: var(--g-text);
      font-size: 12.5px; appearance: none;
    }
    #sr2 .sr2-sort select option { background: #232027; color: #ece5d8; font-size: 12.5px; }
    #sr2 .sr2-seg {
      display: flex; padding: 2px;
      border-radius: 8px; background: rgba(0,0,0,.26); border: 1px solid var(--g-line);
    }
    #sr2 .sr2-seg button {
      height: 26px; padding: 0 10px; border: 0; border-radius: 6px;
      background: transparent; color: var(--g-muted); font-size: 12px;
    }
    #sr2 .sr2-seg button:hover { color: var(--g-text); }
    #sr2 .sr2-seg button.active { background: rgba(255,255,255,.10); color: var(--g-text); }

    #sr2 .sr2-body {
      flex: 1; min-height: 0;
      margin-top: 8px;
      border: 1px solid var(--g-line); border-radius: 9px;
      background: rgba(0,0,0,.18);
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.20) transparent;
    }
    #sr2 .sr2-body::-webkit-scrollbar { width: 8px; }
    #sr2 .sr2-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.18); border-radius: 4px; }
    #sr2 .sr2-body::-webkit-scrollbar-corner { background: transparent; }
    #sr2 .sr2-grid[hidden], #sr2 .sr2-list[hidden] { display: none; }
    #sr2 .sr2-grid {
      display: grid;
      grid-auto-rows: 40px;
      gap: 6px;
      padding: 8px;
      align-content: start;
      justify-content: center;
    }
    #sr2 .sr2-slot {
      position: relative;
      width: 40px; height: 40px;
      border-radius: 5px;
      border: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, #18181c, #212126);
      display: flex; align-items: center; justify-content: center;
      font-size: 19px; line-height: 1; padding: 0; overflow: hidden;
    }
    #sr2 .sr2-slot:hover { border-color: rgba(240,176,60,.55); background: linear-gradient(180deg, #202025, #2a2927); }
    #sr2 .sr2-slot.empty {
      background: rgba(255,255,255,.015);
      border-style: dashed; border-color: rgba(255,255,255,.05); cursor: default;
    }
    #sr2 .sr2-slot.fav { border-color: rgba(240,176,60,.7); box-shadow: inset 0 0 0 1px rgba(240,176,60,.18); }
    #sr2 .sr2-slot.selected {
      border-color: var(--g-gold-t);
      box-shadow: 0 0 0 1px rgba(255,225,160,.55), inset 0 0 12px rgba(240,176,60,.15);
    }
    #sr2 .sr2-slot .s-dot {
      position: absolute; left: 3px; top: 3px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--cat, #b0a89a); box-shadow: 0 0 4px var(--cat, #b0a89a);
    }
    #sr2 .sr2-slot .s-cnt {
      position: absolute; right: 2px; bottom: 1px;
      min-width: 11px; padding: 0 2px; border-radius: 2px;
      background: rgba(0,0,0,.74); color: #f5efe2;
      font-size: 10px; line-height: 13px; text-align: center;
      font-family: Consolas, monospace;
    }
    #sr2 .sr2-slot .s-new {
      position: absolute; right: 2px; top: 2px;
      width: 5px; height: 5px; border-radius: 50%;
      background: var(--g-gold); box-shadow: 0 0 5px rgba(240,176,60,.8);
    }

    #sr2 .sr2-list { display: flex; flex-direction: column; gap: 3px; padding: 6px; }
    #sr2 .sr2-list-head {
      display: grid;
      grid-template-columns: 26px minmax(0,1fr) 44px 52px;
      gap: 6px; padding: 2px 8px;
      color: var(--g-dim); font-size: 11px; letter-spacing: .03em;
    }
    #sr2 .sr2-list-head .num { text-align: right; }
    #sr2 .sr2-row {
      display: grid;
      grid-template-columns: 26px minmax(0,1fr) 44px 52px;
      gap: 6px; align-items: center;
      min-height: 38px; padding: 0 8px;
      border-radius: 6px; border: 1px solid transparent;
      background: rgba(255,255,255,.025); text-align: left;
    }
    #sr2 .sr2-row:hover { border-color: rgba(240,176,60,.35); background: rgba(255,255,255,.055); }
    #sr2 .sr2-row.selected { border-color: rgba(255,225,160,.55); background: rgba(240,176,60,.08); }
    #sr2 .sr2-row-ico { font-size: 17px; text-align: center; }
    #sr2 .sr2-row-main { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    #sr2 .sr2-row-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sr2 .sr2-row-sub { font-size: 11px; color: var(--g-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sr2 .sr2-row-cnt { text-align: right; font-size: 11.5px; color: var(--g-muted); font-family: Consolas, monospace; }
    #sr2 .sr2-row-dyn { text-align: right; font-size: 11.5px; color: var(--g-gold); font-family: Consolas, monospace; }
    #sr2 .sr2-row-dyn.cat { color: var(--g-muted); font-family: inherit; }
    #sr2 .sr2-empty {
      grid-column: 1 / -1;
      padding: 30px 10px; text-align: center;
      color: var(--g-dim); font-size: 12px;
    }

    #sr2 .sr2-hover {
      min-height: 24px; padding: 5px 2px 0;
      color: var(--g-muted); font-size: 11.5px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #sr2 .sr2-hover b { color: var(--g-text); font-weight: 500; }
    #sr2 .sr2-hover .hv-gold { color: var(--g-gold); }
    #sr2 .sr2-rail-foot {
      display: flex; justify-content: space-between; gap: 8px;
      padding-top: 6px; margin-top: 2px;
      border-top: 1px solid var(--g-line);
      color: var(--g-dim); font-size: 11px;
    }
    #sr2 .sr2-rail-foot .fr { color: var(--g-gold); }
    #sr2 .sr2-rail-foot .fr.warn { color: var(--g-red); }

    /* 弹出面板：容器清单 / 标签库（挂在侧栏内，absolute） */
    #sr2 .sr2-pop {
      position: absolute;
      left: 10px; right: 10px; top: 118px;
      z-index: 20;
      max-height: 420px;
      display: flex; flex-direction: column;
      border: 1px solid var(--g-line-2); border-radius: 10px;
      background: #201d24;
      box-shadow: 0 18px 44px rgba(0,0,0,.55);
      overflow: hidden;
    }
    #sr2 .sr2-pop[hidden] { display: none; }
    #sr2 .sr2-pop-head {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 10px; border-bottom: 1px solid var(--g-line);
      color: var(--g-muted); font-size: 12px;
    }
    #sr2 .sr2-pop-body { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 10px; }
    #sr2 .sr2-pop-body::-webkit-scrollbar { width: 7px; }
    #sr2 .sr2-pop-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,.16); border-radius: 4px; }
    #sr2 .sr2-pop-search {
      display: flex; align-items: center; gap: 6px;
      height: 28px; margin: 8px 10px 0; padding: 0 8px;
      border-radius: 7px; border: 1px solid var(--g-line);
      background: rgba(0,0,0,.3); color: var(--g-dim);
    }
    #sr2 .sr2-pop-search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--g-text); font-size: 12px; }
    #sr2 .sr2-grp-title { color: var(--g-dim); font-size: 11px; letter-spacing: .06em; margin: 8px 0 5px; }
    #sr2 .sr2-ctn-item {
      display: flex; align-items: center; gap: 8px;
      width: 100%; min-height: 34px; padding: 3px 8px;
      border-radius: 6px; border: 1px solid transparent;
      background: rgba(255,255,255,.02); text-align: left;
    }
    #sr2 .sr2-ctn-item:hover { border-color: rgba(240,176,60,.35); background: rgba(255,255,255,.05); }
    #sr2 .sr2-ctn-item.cur { border-color: rgba(255,225,160,.55); background: rgba(240,176,60,.08); }
    #sr2 .sr2-ci-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    #sr2 .sr2-ci-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #sr2 .sr2-ci-sub { font-size: 10.5px; color: var(--g-dim); }
    #sr2 .sr2-ci-meta { color: var(--g-muted); font-size: 11px; font-family: Consolas, monospace; white-space: nowrap; }
    #sr2 .sr2-tagwrap { display: flex; flex-wrap: wrap; gap: 5px; }
    #sr2 .sr2-tag2 {
      height: 24px; padding: 0 9px; border-radius: 999px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); font-size: 11px; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 5px;
    }
    #sr2 .sr2-tag2:hover { color: var(--g-text); border-color: var(--g-line-2); }
    #sr2 .sr2-tag2.active { color: var(--g-gold-t); border-color: rgba(240,176,60,.5); background: rgba(240,176,60,.12); }
    #sr2 .sr2-tag2 .t-dot { width: 6px; height: 6px; border-radius: 50%; }
    #sr2 .sr2-pop-foot {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 10px; border-top: 1px solid var(--g-line);
      color: var(--g-dim); font-size: 11px;
    }
    #sr2 .sr2-pop-clear {
      height: 24px; padding: 0 9px; border-radius: 6px;
      border: 1px solid var(--g-line); background: rgba(255,255,255,.03);
      color: var(--g-muted); font-size: 11px;
    }
    #sr2 .sr2-pop-clear:hover { color: var(--g-text); }

    /* ───────── 中央 / 右侧场景面板 ───────── */
    #sr2 .sr2-center { flex: 1 1 0; min-width: 0; height: 790px; display: flex; }
    #sr2 .sr2-right { flex: 0 0 300px; height: 790px; display: flex; flex-direction: column; }
    #sr2 .sr2-panel {
      width: 100%;
      display: flex; flex-direction: column;
      padding: 14px;
      border: 1px solid var(--g-line); border-radius: 12px;
      background: linear-gradient(180deg, rgba(39,34,30,.96), rgba(24,21,19,.98));
      box-shadow: 0 12px 34px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.04);
    }
    #sr2 .sr2-panel-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 14px; font-weight: 600; letter-spacing: .04em;
    }
    #sr2 .sr2-tbar { width: 4px; height: 16px; border-radius: 2px; background: var(--g-gold); box-shadow: 0 0 9px rgba(240,176,60,.5); }
    #sr2 .sr2-pcount { margin-left: auto; color: var(--g-muted); font-size: 11px; font-weight: 400; }

    /* 烹饪 */
    #sr2 .sc-cook { align-items: center; justify-content: center; gap: 10px; }
    #sr2 .sr2-pot-wrap { position: relative; width: 220px; height: 220px; display: flex; align-items: center; justify-content: center; }
    #sr2 .sr2-pot-ring {
      position: absolute; inset: 8px; border-radius: 50%;
      border: 1px solid rgba(240,176,60,.18);
      box-shadow: inset 0 0 40px rgba(240,176,60,.06), 0 0 30px rgba(0,0,0,.4);
    }
    #sr2 .sr2-pot-ring::before { content: ""; position: absolute; inset: 20px; border-radius: 50%; border: 1px dashed rgba(255,255,255,.08); }
    #sr2 .sr2-pot {
      width: 148px; height: 148px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 64px;
      background: radial-gradient(circle at 42% 36%, #3a3028, #151311 70%);
      box-shadow: inset 0 8px 24px rgba(0,0,0,.7), 0 10px 26px rgba(0,0,0,.4);
    }
    #sr2 .sr2-fuel { width: 100%; max-width: 380px; margin-top: 6px; padding: 10px; border-radius: 8px; border: 1px dashed rgba(255,255,255,.12); background: rgba(0,0,0,.16); }
    #sr2 .sr2-fuel-head { display: flex; justify-content: space-between; color: var(--g-muted); font-size: 11.5px; margin-bottom: 7px; }
    #sr2 .sr2-fuel-slots { display: flex; gap: 7px; }

        els.railTitle.textContent = c.n;
        els.railCap.textContent = state.cols + '×' + state.rows;
        els.rail.style.width = railWidthPx(state.cols) + 'px';

        var filtered = visibleItems();
        var bodyChrome = 262;                    /* 侧栏头部控件总高 */
        var bodyMax = 790 - bodyChrome;          /* 可用网格高度 */
        var naturalH = state.rows * (SLOT + GAP) + 18;
        els.body.style.maxHeight = Math.min(bodyMax, naturalH) + 'px';

        els.fillStatus.textContent = filtered.length + ' / ' + state.cells + ' 格';
        if (clamped) {
          els.viewStatus.textContent = '宽度 ' + state.srcCols + '→' + MAXCOLS + ' 封顶 · 转为 ' + state.rows + ' 行';
          els.viewStatus.className = 'fr warn';
        } else {
          els.viewStatus.textContent = naturalH > bodyMax ? '↓ 纵向滚动查看' : '全部可见';
          els.viewStatus.className = 'fr';
        }
        els.railCols.textContent = clamped ? '8 列封顶' : state.cols + ' 列';
        els.railTags.textContent = c.tags.length ? ' · ' + c.tags.join('·') : '';

        var seg = els.modeSeg.querySelectorAll('[data-mode]');
        for (var s = 0; s < seg.length; s++)
          seg[s].classList.toggle('active', seg[s].getAttribute('data-mode') === state.mode);

        renderCtnBar(); renderTags();

        if (state.mode === 'grid') {
          els.grid.hidden = false; els.list.hidden = true;
          els.grid.style.gridTemplateColumns = 'repeat(' + state.cols + ', ' + SLOT + 'px)';
          var html = '';
          if (!filtered.length) html = '<div class="sr2-empty">没有匹配的物品</div>';
          else for (var i = 0; i < state.cells; i++)
            html += i < filtered.length ? slotHtml(filtered[i], 'sr2-slot') : '<div class="sr2-slot empty" aria-hidden="true"></div>';
          els.grid.innerHTML = html;
        } else {
          els.grid.hidden = true; els.list.hidden = false;
          var dyn = DYN[state.sort] || DYN.category;
          var lh = '<div class="sr2-list-head"><span></span><span>物品</span><span class="num">数量</span><span class="num">' + dyn.label + '</span></div>';
          if (!filtered.length) lh += '<div class="sr2-empty">没有匹配的物品</div>';
          else for (var j = 0; j < filtered.length; j++) {
            var it = filtered[j];
            lh += '<button type="button" class="sr2-row' + (state.selectedId === it.id ? ' selected' : '') + '" data-item-id="' + it.id + '">' +
              '<span class="sr2-row-ico" aria-hidden="true">' + it.emoji + '</span>' +
              '<span class="sr2-row-main"><span class="sr2-row-name">' + esc(it.name) + '</span>' +
              '<span class="sr2-row-sub">' + esc(it.cat) + ' · 保质 ' + it.shelf + 'h · 饱食 +' + it.sat + ' · 价值 ' + it.value + '</span></span>' +
              '<span class="sr2-row-cnt">×' + it.count + '</span>' +
              '<span class="sr2-row-dyn ' + dyn.cls + '">' + dyn.cell(it) + '</span></button>';
          }
          els.list.innerHTML = lh;
        }

        els.wsSub.textContent = c.n + ' · ' + state.cols + '×' + state.rows + '（原 ' + state.srcCols + '×' + state.srcRows + '）· ' + filtered.length + ' 件';
        els.wsStatus.textContent = filtered.length + ' / ' + state.cells + ' 格';
        var wh = '';
        if (!filtered.length) wh = '<div class="sr2-empty">没有匹配的物品</div>';
        else for (var k = 0; k < state.cells; k++)
          wh += k < filtered.length ? slotHtml(filtered[k], 'sr2-ws-slot') : '<div class="sr2-ws-slot empty" aria-hidden="true"></div>';
        els.wsGrid.innerHTML = wh;
      }

      function findItem(id) {
        for (var i = 0; i < state.items.length; i++) if (state.items[i].id === id) return state.items[i];
        return null;
      }
      function showHover(it) {
        if (!it) { els.hoverDetail.textContent = '悬停查看物品详情'; return; }
        els.hoverDetail.innerHTML = '<b>' + esc(it.name) + '</b> ×' + it.count +
          ' · 交易 <span class="hv-gold">' + it.value + '</span> · 保质 ' + it.shelf + 'h · 饱食 +' + it.sat;
      }

      /* ── 事件 ── */
      els.scenes.addEventListener('click', function (e) {
        var b = e.target.closest('[data-scene]');
        if (b) { state.scene = b.getAttribute('data-scene'); renderScene(); }
      });
      els.pinRow.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ctn]');
        if (!b) return;
        state.currentId = parseInt(b.getAttribute('data-ctn'), 10);
        var c = currentCtn(); applySizeRule(c.cols, c.rows); state.selectedId = null; render();
      });
      els.ctnCur.addEventListener('click', function () {
        renderCtnPop(); els.tagPop.hidden = true; els.ctnPop.hidden = !els.ctnPop.hidden;
      });
      els.allCtn.addEventListener('click', function () {
        renderCtnPop(); els.tagPop.hidden = true; els.ctnPop.hidden = !els.ctnPop.hidden;
      });
      els.ctnPopClose.addEventListener('click', function () { els.ctnPop.hidden = true; });
      els.ctnSearch.addEventListener('input', function () { state.ctnQuery = els.ctnSearch.value; renderCtnPop(); });
      els.ctnPopBody.addEventListener('click', function (e) {
        var b = e.target.closest('[data-ctn]');
        if (!b) return;
        state.currentId = parseInt(b.getAttribute('ctn') || b.getAttribute('data-ctn'), 10);
        var c = currentCtn(); applySizeRule(c.cols, c.rows); state.selectedId = null;
        els.ctnPop.hidden = true; render();
      });
      els.tagRow.addEventListener('click', function (e) {
        var b = e.target.closest('[data-tag]');
        if (!b) return;
        var t = b.getAttribute('data-tag');
        if (t === '__all') state.tags = [];
        else {
          var i = state.tags.indexOf(t);
          if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
        }
        render();
      });
      els.tagMore.addEventListener('click', function () {
        els.ctnPop.hidden = true; els.tagPop.hidden = !els.tagPop.hidden;
      });
      els.tagPopBody.addEventListener('click', function (e) {
        var b = e.target.closest('[data-tagm]');
        if (!b) return;
        var t = b.getAttribute('data-tagm');
        var i = state.tags.indexOf(t);
        if (i >= 0) state.tags.splice(i, 1); else state.tags.push(t);
        renderTags();
      });
      els.tagClear.addEventListener('click', function () { state.tags = []; render(); });
      els.searchInput.addEventListener('input', function () { state.query = els.searchInput.value; render(); });
      els.wsSearch.addEventListener('input', function () { state.query = els.wsSearch.value; render(); });
      els.sortSelect.addEventListener('change', function () { state.sort = els.sortSelect.value; render(); });
      els.modeSeg.addEventListener('click', function (e) {
        var b = e.target.closest('[data-mode]');
        if (b) { state.mode = b.getAttribute('data-mode'); render(); }
      });
      els.body.addEventListener('mouseover', function (e) {
        var el = e.target.closest('[data-item-id]');
        if (el) showHover(findItem(parseInt(el.getAttribute('data-item-id'), 10)));
      });
      els.body.addEventListener('mouseleave', function () { showHover(null); });
      els.body.addEventListener('click', function (e) {
        var el = e.target.closest('[data-item-id]');
        if (!el) return;
        var id = parseInt(el.getAttribute('data-item-id'), 10);
        state.selectedId = state.selectedId === id ? null : id;
        render();
        if (state.selectedId !== null) showHover(findItem(state.selectedId));
      });
      els.controls.addEventListener('click', function (e) {
        var b = e.target.closest('[data-preset]');
        if (!b) return;
        var p = b.getAttribute('data-preset').split('x');
        var c = currentCtn();
        c.cols = parseInt(p[0], 10); c.rows = parseInt(p[1], 10);
        applySizeRule(c.cols, c.rows); state.selectedId = null; render();
        var all = els.controls.querySelectorAll('[data-preset]');
        for (var i = 0; i < all.length; i++) all[i].classList.toggle('btn-primary', all[i] === b);
      });
      els.expandBtn.addEventListener('click', function () { els.workspace.hidden = false; render(); });
      els.wsClose.addEventListener('click', function () { els.workspace.hidden = true; });
      window.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { els.workspace.hidden = true; els.ctnPop.hidden = true; els.tagPop.hidden = true; }
      });

      /* ── 1:1 缩放适配 ── */
      function fit() {
        var w = els.fitwrap.clientWidth || 960;
        var s = Math.min(1, w / 1536);
        els.stage.style.transform = s < 1 ? 'scale(' + s + ')' : '';
        els.fitwrap.style.height = (864 * s + 2) + 'px';
        els.scaleBadge.textContent = '1536 × 864 · ' + Math.round(s * 100) + '%';
      }
      window.addEventListener('resize', fit);

      /* ── 启动：大柜（触发宽度封顶规则演示） ── */
      applySizeRule(20, 16);
      renderScene();
      render();
      fit();
    })();
  </script>
</div>
