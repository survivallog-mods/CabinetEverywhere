  .bubble::before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:rgba(255,255,255,.04);}
  .bubble.eager{color:var(--accent);} .bubble.deal{color:var(--accent);border-color:rgba(255,193,7,.5);background:rgba(255,193,7,.08);box-shadow:0 0 18px var(--accent-glow);}
  .bubble .mood{font-size:11px;letter-spacing:1px;opacity:.7;display:block;margin-bottom:2px;}
  .close-x{flex:0 0 auto;width:28px;height:28px;border-radius:8px;border:1px solid var(--panel-border);background:transparent;color:var(--text-dim);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:.18s;}

  .item::before{content:'';position:absolute;inset:0;border-radius:4px;pointer-events:none;background:linear-gradient(160deg,rgba(255,255,255,.1) 0%,transparent 60%);}
  .item::after{content:'';position:absolute;bottom:0;left:0;right:0;height:40%;border-radius:0 0 4px 4px;pointer-events:none;background:linear-gradient(0deg,rgba(0,0,0,.35) 0%,transparent 100%);}

  /* 同类预览高亮（2026-09-23）：按住高亮键悬停左栏某件时本栏同类一起描边。

  .item.kin-hint{transition:none;border-color:rgba(255,233,74,1) !important;
    box-shadow:0 0 14px rgba(255,233,74,.6), inset 0 0 8px rgba(255,233,74,.3) !important;}

  .item.rarity-legendary{border-color:var(--rarity-legendary-border);background:linear-gradient(var(--rarity-legendary-bg),var(--rarity-legendary-bg)),var(--item-underlay);box-shadow:0 0 12px rgba(255,193,7,.25);}
  .item-icon{max-width:92%;max-height:92%;z-index:1;border-radius:4px;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));pointer-events:none;}
  .item-ph{width:70%;height:70%;border:1px dashed rgba(207,210,218,.3);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;color:#cfd2da;opacity:.45;z-index:1;pointer-events:none;}
  .item-count{position:absolute;bottom:3px;right:4px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.08);padding:0 6px;border-radius:9px;line-height:14px;letter-spacing:.3px;text-shadow:0 1px 2px rgba(0,0,0,.8);box-shadow:0 2px 4px rgba(0,0,0,.45);z-index:2;pointer-events:none;}

  .expired-mask{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:0;background:linear-gradient(to top,rgba(146,52,38,.7) 0%,rgba(146,52,38,.45) 35%,rgba(146,52,38,.15) 75%,rgba(146,52,38,0) 100%);}
  /* 快过期：底部 12px 贴底黄晕（无硬线），与已过期的暗红褐满片染底靠色相(黄/红)+范围(12px/整格)+浓度(.42/.7)区分。
     12px 已接近上限：形态同为底部染色，实测拉到 16px 范围与已过期拉平就会误认。刻意做轻：提醒而非判决。 */
  .near-expiry-mask{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:5;

  .item.q-perfect,.ghost.q-perfect{border-color:var(--q-perfect);box-shadow:0 0 14px 1px var(--q-perfect-glow),inset 0 0 8px rgba(255,193,7,.12);}

  .item-use{position:absolute;bottom:5px;left:3px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.7);border:1px solid rgba(255,255,255,.12);padding:0 5px;border-radius:8px;line-height:13px;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px rgba(0,0,0,.85);box-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;z-index:4;}

  .grid-empty-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:11px;opacity:.4;pointer-events:none;text-align:center;padding:0 12px;}

  .bag-toolbar{display:flex;justify-content:flex-end;align-items:center;margin-top:9px;}
  .sort-btn{display:flex;align-items:center;gap:6px;font-family:inherit;font-size:12px;letter-spacing:.5px;color:var(--text-dim);background:rgba(255,255,255,.04);border:1px solid var(--panel-border);border-radius:6px;padding:6px 14px;cursor:pointer;transition:.18s;}
  .sort-btn svg{width:13px;height:13px;fill:currentColor;opacity:.8;}

  .drop-hl{position:absolute;border-radius:5px;pointer-events:none;z-index:2;}

  .shelf-list{flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:4px;}

  .shelf-row{display:flex;align-items:center;padding:8px;gap:10px;position:relative;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05);border-radius:4px;transition:background-color .2s;}
  .shelf-row:hover{background:rgba(255,255,255,.06);}
  .shelf-row.on{background:rgba(255,193,7,.07);}
  .shelf-row.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
  .shelf-icon{width:54px;height:54px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(207,210,218,.22);border-radius:6px;font-size:9px;color:#cfd2da;opacity:.6;overflow:hidden;}
  .shelf-icon img{width:100%;height:100%;object-fit:contain;}
  .shelf-details{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .shelf-row-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .shelf-name{flex:1;min-width:0;font-size:13px;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .shelf-name.rare{color:#7db4ff;} .shelf-name.legendary{color:var(--accent);}
  .shelf-stock{font-size:11px;color:var(--text-dim);flex-shrink:0;font-family:Consolas,monospace;}
  .shelf-row-bottom{display:flex;align-items:center;gap:8px;min-height:24px;min-width:0;}

  .stepper{display:flex;align-items:center;height:24px;border-radius:5px;overflow:hidden;border:1px solid var(--panel-border);flex-shrink:0;margin-left:auto;}
  .sbtn{width:26px;height:100%;background:rgba(255,255,255,.04);color:var(--text-color);border:none;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .sbtn:hover:not(:disabled){background:rgba(255,193,7,.2);} .sbtn:disabled{opacity:.3;cursor:not-allowed;}
  .sbtn.max{width:auto;padding:0 6px;font-size:10.5px;font-weight:600;color:var(--accent);border-left:1px solid var(--panel-border);}
  .sbtn.max:disabled{color:var(--text-dim);}

  .snum{min-width:34px;text-align:center;font-size:12px;font-weight:700;font-family:Consolas,monospace;} .snum.zero{color:var(--text-dim);font-weight:400;}

  .sup-list{flex:1 1 0;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:4px;}
  .sup-list::-webkit-scrollbar{width:6px;}
  .sup-list::-webkit-scrollbar-thumb{background:#555;border-radius:3px;}
  .sup-row{display:flex;align-items:center;padding:9px 8px;gap:10px;position:relative;background:rgba(255,255,255,.02);border-bottom:1px solid rgba(255,255,255,.05);border-radius:4px;cursor:pointer;transition:background-color .2s;}
  .sup-row:hover{background:rgba(255,255,255,.06);}
  .sup-row.on{background:rgba(255,193,7,.07);}
  .sup-row.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
  .sup-face{position:relative;width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#1a1a1a;background:radial-gradient(circle at 35% 30%,#ffd95e,#c8920c);}
  .sup-row.warn .sup-face{background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828);color:#fff;}
  .sup-details{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
  .sup-name{font-size:13px;font-weight:600;color:#fff;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  /* 食物(存粮)条：条身与种子/材料**完全同构** —— 都用 .sup-cell/.sup-track/.sup-fill 这一套。
     本类只剩两件事：独立成行的布局、紧急态染文字。
     🚨 条身颜色一律由 dimCls(填充% vs 偏低线%) 判，与刻度线同源。**别再给条身单独写颜色规则**：
     以前 .sup-supply-bar 那套是按「距失联天数」染色、条长却按储备%画，两套判据分开写必漂移
     （2026-09-11 用户实报「三个进度条样式都不一样」，就是这两套结构并存的直接结果）。 */
  .sup-supply{display:flex;align-items:center;gap:4px;font-size:10px;color:#6b6b6b;}
  .sup-supply-label{white-space:nowrap;flex-shrink:0;}
  .sup-supply.is-soon{color:var(--accent);}
  .sup-supply.is-urgent{color:#ff5252;font-weight:600;}
  /* 五维里的两个可见档位：种子(胶囊) / 材料(直角条)。0 偏低 / 1 正常 / 2 富余。
     刻意不加文字标签——设计口径是「不告知规则，让玩家自己发现」；加标签既要走 loc 全流程，
     也会把「一共几个维度」这件事挑明，燃料/医药两个隐藏维度的存在感会跟着漏出去。
     档位切换是低频（日结算后重开面板才变），不挂 transition：background-color 是 paint 属性。 */
  /* 种子 / 材料两条水位条（2026-09-11 从三档色块改成带标签的进度条）。
     🚨 与 PhoneSMS 的 .conv-cell / .conv-track 严格同源，改一处必须同步改那边。
     为什么不再用色块：两个无名色块既读不出「哪条是哪个维度」，也读不出「离报警还有多远」——
     只有档位跳变时才有信号（用户实报「完全看不清楚，根本没注意到」「不知道哪一条对应什么维度」）。
     现在：左侧文字标签（复用 Cat_10/Cat_9 现成词条，零新增 loc）+ 进度条 + 偏低线刻度 + 富余线刻度。
     🚨 量程＝富余线的 **2 倍**（BAR_SPAN，2026-09-11 用户裁定）：条的正中间是富余线、最右端是
     「投送拒收线 ＝ 专属回赠门槛」。下发的 pct 口径没变（100 ＝ 富余线），换算只发生在 barFrac/tickStyle。
     三条同构、与存粮条同一把尺，所以能并排读。
     ⚠ 交易页抬头的 .pd-cell 也复用本套类，改这里那边跟着变。 */
  /* 三条水位条一律纵向排列（食物 / 种子 / 材料各占一行，标签左对齐、条头对齐）——
     用户 2026-09-11 裁定：不要种子/材料横排。横排时选中行因 +N 标签被挤换行、未选中行不换行，
     同一列表里两种排法并存，读起来像两种控件。gap 与 .sup-details 的 3px 同值，三条才真正等距。 */
  .sup-dims{display:flex;flex-direction:column;align-items:flex-start;gap:3px;}
  .sup-cell{display:flex;align-items:center;gap:4px;}
  .sup-dl{font-size:10px;color:#6b6b6b;white-space:nowrap;letter-spacing:.3px;}
  .sup-track{position:relative;display:block;width:56px;height:6px;border-radius:3px;
             background:rgba(255,255,255,.10);overflow:hidden;flex-shrink:0;}
  /* fill 常驻 100% 宽、动 transform:scaleX（合成器直通、零重排）—— 规范禁 transition:width（webui-effects-performance）。
     圆角交给 .sup-track 的 overflow:hidden 裁出；fill 自身不带圆角，scaleX 会把它横向压扁。 */
  .sup-fill{position:absolute;left:0;top:0;bottom:0;width:100%;transform:scaleX(0);transform-origin:left;background:#9096a0;transition:transform .35s ease;}
  /* 低于偏低线 = 分诊唯一真正要抢注意力的状态。判据在前端按「填充% < 偏低线%」现算(dimCls)，
     与刻度线位置同源，不可能出现「跌到刻度左边却没变红」。 */
  /* 条身三档（2026-09-11 用户裁定，去掉灰档）：红 → 黄 → 绿，危急到富裕。
     红＝低于偏低线（分诊唯一真正要抢注意力的状态，只有它带呼吸动画）；
     黄＝偏低线到富余线之间**整段**；绿＝富余线以上。判据全在 dimCls，见那里的注释。
     🚨 <b>富余线以上一律绿，不再有第二档</b>：原先条满(>=200)是金色 .sup-full，
     用户裁定撤掉 ——「只要超过富裕线就都是绿的」。
     于是"投得进去投不进去"只由拖拽时的飘字回答，条身只回答"他缺不缺"。
     🚨 <b>黄必须与 --accent 拉开</b>(现 #e2c422 vs #ffc107)：预览段 .sup-fill.preview 正是
     40% 透明的 --accent，同色的话黄区里「这一单往前长了一截」会糊成一片、看不出预览。 */
  .sup-fill.is-low{background:#ff5252;animation:sup-fill-low 1.8s ease-in-out infinite;}
  /* 2026-09-28 用户：黄档「稍微偏绿一点」#ffb300 → #e2c422（色相 42° → 52°），离预览段的 --accent 也更远。 */
  .sup-fill.is-warn{background:#e2c422;}
  .sup-fill.is-high{background:#66bb6a;}
  @keyframes sup-fill-low{0%,100%{opacity:1;}50%{opacity:.6;}}
  .gpage.quality-low .sup-fill.is-low{animation:none;}
  /* 两根刻度：偏低线（警戒）与富余线（目标）。条上的竖线让玩家读得出「还差多少」而不是等颜色跳变。
     🚨 <b>两者样式必须完全一致</b>（2026-09-11 用户裁定），所以刻意写成同一条规则 ——
     分开写早晚漂移成两种粗细/两种颜色。位置由 tickStyle() 算，富余线那根不写死 50%
     （改 BAR_SPAN 时自动跟着走）。 */
  .sup-lowtick,.sup-hitick{position:absolute;top:-1px;bottom:-1px;width:1px;background:rgba(102,187,106,.5);z-index:3;}
  /* 本单增量 +N：绿色＝"这一单让他这一维涨多少"，与条上半透明黄的预览段同源同帧。
     数字给的是**可读的量**，预览段给的是**相对位置**，两个一起玩家才知道"再加两件够不够"。 */
  .pv-inc{font-size:10px;font-weight:600;color:#66bb6a;white-space:nowrap;flex-shrink:0;font-family:Consolas,monospace;}
  /* 本单预览：半透明黄的一截铺在底层、当前段盖在上层 —— 视觉上就是「实色 + 半透明往前长的一截」，
     不必再算差值区间。fracTo<frac 不可能发生（给出物只加不减）。食物/种子/材料三条共用。 */
  .sup-fill.preview{background:var(--accent);opacity:.4;z-index:1;}
  .sup-fill.cur{z-index:2;}

  /* 专属回赠门槛已够格：整行高亮 + 行尾星标。这是它唯一的存在证据，
     要显眼到玩家会主动去点，但不弹任何提示——让他自己发现「这个人和别人不一样了」。
     判据由 Logic 下发（IsGiftStarOn ＝ 三个可见维都填到条满），本层只渲染不判断。
     ★ 与三条水位条天然同步：三条都推到最右端（条满）那一刻，星就亮了。 */
  .sup-row.star{background:rgba(255,193,7,.10);box-shadow:inset 0 0 0 1px rgba(255,193,7,.28);}
  .sup-row.star:hover{background:rgba(255,193,7,.16);}
  .sup-star{flex:0 0 14px;width:14px;height:14px;position:relative;margin-left:2px;}
  .sup-star::before{content:"★";position:absolute;inset:0;font-size:13px;line-height:14px;text-align:center;color:var(--accent);text-shadow:0 0 6px var(--accent-glow);animation:sup-star-pulse 2.4s ease-in-out infinite;}
  @keyframes sup-star-pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.72;transform:scale(.92);}}

  /* 病倒：头像右下角红十字点。日耗 ×1.40，玩家该看得见——但同样不给文案。 */
  .sup-sick{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:#e53935;border:2px solid #1d1d20;box-shadow:0 0 6px rgba(229,57,53,.65);}
  .sup-sick::before{content:"";position:absolute;left:50%;top:2px;width:1.5px;height:5px;margin-left:-.75px;background:#fff;border-radius:1px;}
  .sup-sick::after{content:"";position:absolute;top:50%;left:2px;height:1.5px;width:5px;margin-top:-.75px;background:#fff;border-radius:1px;}

  /* 货舱逐维折算预览：这批东西送过去会变成多少。三个标记的形状与左栏档位条一一对应
     （实心条=饱腹 / 胶囊=种子 / 直角条=材料），玩家靠形状建立对应关系，因此同样不加文案。
     🚨 只有三个可见维度 —— 放柴油/药品时整条不出现，那是隐藏维度的预期表现，不是漏渲染。 */
  .sup-preview{display:flex;align-items:center;gap:12px;padding:6px 2px 0;font-size:11px;color:var(--text-dim);}
  .pv{display:flex;align-items:center;gap:4px;font-family:Consolas,monospace;font-weight:600;color:#c9c9c9;}
  .pv-ico{display:block;width:14px;height:4px;background:#6b6b6b;}
  .pv-ico.sat{border-radius:1px;background:var(--accent);}
  .pv-ico.seed{border-radius:99px;background:#66bb6a;}
  .pv-ico.mat{border-radius:1px;background:#8d9db6;}
  /* 画质分级：Low 档静态化长驻 infinite 动画（纯装饰 → 直接禁用）。 */
  .gpage.quality-low .sup-star::before{animation:none;}
  .sup-empty{padding:20px 8px;text-align:center;font-size:12px;color:var(--text-dim);opacity:.5;line-height:1.6;}

  .foot{display:flex;align-items:center;gap:18px;padding:13px 22px 16px;border-top:1px solid var(--panel-border);}
  .foot-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;}
  .will-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;}
  .will-title{font-size:13px;font-weight:600;letter-spacing:.5px;color:var(--text-dim);transition:.3s;}
  .will-title.ok{color:var(--accent);text-shadow:0 0 12px var(--accent-glow);}
  .will-title.warn{color:#FF5252;}
  .will-track{position:relative;height:13px;border-radius:7px;background:var(--weight-bar-bg);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden;transition:box-shadow .4s;}
  .will-fill{height:100%;width:0;border-radius:7px;background:linear-gradient(90deg,#4a4a52,#6a6a72);transition:width .45s cubic-bezier(.4,0,.2,1),background .4s;}
  .will-track.close .will-fill{background:var(--weight-bar-fill);opacity:.82;}
  .will-track.ok .will-fill{background:var(--weight-bar-fill);box-shadow:0 0 14px var(--accent-glow);}
  .will-track.warn .will-fill{background:var(--weight-bar-overload);}
  .will-track.ok{box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 0 0 1px rgba(255,193,7,.45),0 0 16px var(--accent-glow);}
  .will-track::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:rgba(255,255,255,.18);}

  .bal-track{position:relative;height:15px;border-radius:8px;background:var(--weight-bar-bg);box-shadow:inset 0 2px 5px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.04);overflow:hidden;transition:box-shadow .4s;}
  .bal-track.ok{box-shadow:inset 0 2px 5px rgba(0,0,0,.4),0 0 0 1px rgba(255,193,7,.45),0 0 16px var(--accent-glow);}
  .bal-track.idle{opacity:.4;}
  .bal-zone{position:absolute;top:0;bottom:0;left:0;right:0;background:rgba(255,193,7,.10);border-left:1px solid rgba(255,193,7,.30);transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .bal-track.ok .bal-zone{background:rgba(255,193,7,.18);}
  .bal-fill{position:absolute;top:0;bottom:0;left:0;right:0;transform-origin:left;background:var(--weight-bar-fill);transition:transform .45s cubic-bezier(.4,0,.2,1),background .4s;}
  /* 叠层（类 Boss 血条）：一侧半幅 = 一层，超出半幅就从中线重新填一层，右上角标 ×N（N = 剩余总层数，含当前层）。
     .bal-under 是当前层下面那层，铺满这一侧半幅；层色按层号 4 色循环，正负两侧各一套。
     只用 transform 定位（左半 scaleX(.5)、右半再 translateX(50%)），不动 width。 */
  .bal-under{position:absolute;top:0;bottom:0;left:0;right:0;transform-origin:left;}
  .bal-under.pos{transform:translateX(50%) scaleX(.5);}
  .bal-under.neg{transform:scaleX(.5);}
  .lp0{background:var(--weight-bar-fill);}
  .lp1{background:linear-gradient(90deg,#b8560a,#FF8A3D);}
  .lp2{background:linear-gradient(90deg,#9a2f5a,#E0508A);}
  .lp3{background:linear-gradient(90deg,#6a3aa8,#A97BFF);}
  .ln0{background:linear-gradient(90deg,#4a4a52,#6a6a72);}
  .ln1{background:linear-gradient(90deg,#34506e,#4f7aa6);}
  .ln2{background:linear-gradient(90deg,#2f5f5a,#4a918a);}
  .ln3{background:linear-gradient(90deg,#523a6e,#7a5aa6);}
  .bal-track.warn .bal-fill{background:var(--weight-bar-overload);}
  .bal-stack{position:absolute;top:1px;bottom:1px;display:flex;align-items:center;padding:0 5px;border-radius:6px;
             background:rgba(0,0,0,.62);color:#fff;font-size:10px;font-weight:700;line-height:1;letter-spacing:.02em;
             font-variant-numeric:tabular-nums;pointer-events:none;animation:balStackPop .3s ease-out;}
  .bal-stack.pos{right:3px;} .bal-stack.neg{left:3px;}
  @keyframes balStackPop{0%{transform:scale(1.35);opacity:.4;}100%{transform:scale(1);opacity:1;}}
  .bal-origin{position:absolute;left:50%;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,255,255,.22);}
  .bal-line-track,.bal-cursor-track{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none;transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .bal-line{position:absolute;left:0;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:var(--accent);opacity:.85;box-shadow:0 0 8px var(--accent-glow);}
  .bal-cursor{position:absolute;left:0;top:-2px;bottom:-2px;width:3px;margin-left:-1.5px;border-radius:2px;background:#fff;box-shadow:0 0 10px rgba(255,255,255,.65);}
  .bal-track.warn .bal-cursor{background:#FF5252;box-shadow:0 0 10px rgba(255,82,82,.7);}
  .bal-track.close .bal-cursor{animation:balNudge 1.1s ease-in-out infinite;}
  @keyframes balNudge{0%,100%{opacity:1;}50%{opacity:.45;}}
  .gpage.quality-low .bal-track.close .bal-cursor{animation:none;}
  .btns{display:flex;gap:10px;flex:0 0 auto;}
  .btn{font-family:inherit;font-size:14px;cursor:pointer;padding:9px 20px;border-radius:8px;letter-spacing:1px;border:1px solid var(--panel-border);background:transparent;color:var(--text-dim);transition:.2s;}
  .btn:hover{color:var(--text-color);background:rgba(255,255,255,.05);}
  .btn.deal{border-color:var(--accent);color:#1a1a1a;background:var(--accent);font-weight:700;box-shadow:0 0 18px var(--accent-glow);}
  .btn.deal.off{background:transparent;color:var(--text-dim);border-color:var(--panel-border);box-shadow:none;cursor:not-allowed;opacity:.6;font-weight:400;}

  .demand-line{display:flex;align-items:center;gap:14px;padding:7px 22px;font-size:12px;color:var(--accent);background:rgba(255,193,7,.05);border-bottom:1px solid var(--panel-border);letter-spacing:.4px;}
  .dl-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* 交易页抬头右侧：对方三维水位 + 本单跃迁预览。
     🚨 形状语言与投送面板左栏（.sup-dim）**严格同一套**，档位块直接复用那边的类：
     饱腹=存粮条 / 种子=胶囊 / 材料=直角条。玩家在两个面板之间靠形状而不是文案建立对应，
     所以这里同样不加标签——加了既要走 loc 全流程，也会把"一共几个维度"挑明，
     燃料/医药两个隐藏维度的存在感会跟着漏出去。
     箭头只在档位**真会变**时出现：它表达的是"这一单的意义"，常驻就没信息量了。 */
  .peer-dims{display:flex;align-items:center;gap:11px;flex-shrink:0;}
  /* 抬头食物条：同上，条身走 .sup-track/.sup-fill 那一套（预览段也复用 .sup-fill.preview），
     本类只留布局与紧急态字色。gap 与 .sup-cell 对齐成 4px，三条才真正等距。 */
  .pd-supply{display:flex;align-items:center;gap:4px;font-size:10px;color:#6b6b6b;letter-spacing:0;}
  .pd-supply.is-soon{color:var(--accent);}
  .pd-supply.is-urgent{color:#ff5252;font-weight:600;}
  .pd-days{white-space:nowrap;}
  .pd-cell{display:flex;align-items:center;gap:3px;}
  .pd-arw{display:block;width:0;height:0;border-style:solid;border-width:3.5px 0 3.5px 5px;border-color:transparent transparent transparent #9e9e9e;}
  .pd-arw.lv0{border-left-color:#ff5252;}
  .pd-arw.lv1{border-left-color:#9e9e9e;}
  .pd-arw.lv2{border-left-color:#66bb6a;}
  /* 星标：已够格=实心常亮（同投送面板），本单才达成=半透明预览态，
     玩家因此看得见"再添两件就够了"。门槛改成纯当天快照(三维都填到条满)之后，
     预览态就是「这一单送完三条条会不会全满」，Reducer 侧 ComputeDimJump 现算。 */
  /* 抬头与投送左栏共用：.is-preview = 本单才达成的星，半透明且不呼吸。 */
  .sup-star.is-preview{opacity:.45;}
  .sup-star.is-preview::before{animation:none;}

  .roster-mask{position:absolute;inset:0;z-index:20;background:rgba(10,10,12,.74);display:flex;align-items:center;justify-content:center;}
  .roster-pop{width:340px;max-height:78%;display:flex;flex-direction:column;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.6);overflow:hidden;}
  .roster-head{display:flex;align-items:center;justify-content:space-between;padding:13px 16px 9px;}
  .roster-title{font-size:15px;font-weight:700;letter-spacing:1px;display:flex;align-items:center;gap:8px;}
  .roster-title .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
  .roster-hint{padding:0 16px 10px;font-size:11px;color:var(--text-dim);border-bottom:1px solid var(--panel-border);}
  .roster-list{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:5px;padding:10px 12px 14px;}
  .roster-list::-webkit-scrollbar{width:6px;}
  .roster-list::-webkit-scrollbar-thumb{background:#555;border-radius:3px;}
  .roster-row{display:flex;align-items:center;gap:10px;padding:10px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06);border-radius:8px;cursor:pointer;transition:background-color .18s,border-color .18s;}
  .roster-row:hover{background:rgba(255,193,7,.07);border-color:rgba(255,193,7,.35);}
  .roster-details{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .roster-name{font-size:13px;font-weight:600;color:#fff;display:flex;align-items:center;gap:6px;min-width:0;}
  .roster-nmtx{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;}
  .roster-urgent{font-size:10px;font-weight:700;color:#ff8a65;border:1px solid rgba(255,138,101,.5);background:rgba(255,138,101,.1);border-radius:4px;padding:0 5px;line-height:16px;letter-spacing:1px;flex:0 0 auto;}
  .roster-want{font-size:11px;color:var(--text-dim);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .roster-row.beg .roster-want{color:#ffb74d;}
  .roster-arrow{font-size:18px;color:var(--text-dim);flex:0 0 auto;}
  .roster-give{flex:0 0 auto;max-width:136px;display:flex;align-items:center;gap:5px;justify-content:flex-end;}
  .roster-give-k{font-size:11px;color:#5f5f5f;white-space:nowrap;}
  .roster-give-v{font-size:11px;color:#c4c4c4;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;}
  .roster-give-sep{color:#5d5d5d;margin:0 1px;}
  .roster-give-more{color:#6b6b6b;margin-left:4px;}
  .roster-give-v [data-c="1"],.cat-chip[data-c="1"]{color:#b0b884;}
  .roster-give-v [data-c="2"],.cat-chip[data-c="2"]{color:#bd9c9c;}
  .roster-give-v [data-c="3"],.cat-chip[data-c="3"]{color:#a9a3bb;}
  .roster-give-v [data-c="5"],.cat-chip[data-c="5"]{color:#9aa8b3;}
  .roster-give-v [data-c="6"],.cat-chip[data-c="6"]{color:#a9b1b8;}
  .roster-give-v [data-c="9"],.cat-chip[data-c="9"]{color:#b3a794;}
  .roster-give-v [data-c="10"],.cat-chip[data-c="10"]{color:#9fbd9f;}
  .roster-give-v [data-c="11"],.cat-chip[data-c="11"]{color:#b8a68c;}
  .roster-give-v [data-c="12"],.cat-chip[data-c="12"]{color:#b5a0a0;}
  .roster-give-v [data-c="13"],.cat-chip[data-c="13"]{color:#c0a882;}
  .roster-give-v [data-c="4"],.cat-chip[data-c="4"]{color:#9fb0bd;}
  .roster-give-v [data-c="8"],.cat-chip[data-c="8"]{color:#b0a8a0;}
  .roster-give-v [data-c="14"],.cat-chip[data-c="14"]{color:#b5ac96;}
  .roster-give-v [data-c="15"],.cat-chip[data-c="15"]{color:#c2a4b4;}
  .roster-give-v [data-c="16"],.cat-chip[data-c="16"]{color:#c09a86;}
  .roster-give-v [data-c="0"],.cat-chip[data-c="0"]{color:#949494;}
  /* 暂缺的品类：标签保留、置灰（与交易地图 .trade-cat-chip.cat-off 同样式） */
  .cat-chip.cat-off[data-c]{color:#5c5c5c;border-color:rgba(255,255,255,.12);background:transparent;}
  .sup-face.beg{background:radial-gradient(circle at 35% 30%,#ff8a80,#c62828);color:#fff;}

  .tooltip{position:fixed;z-index:1000;pointer-events:none;background:rgba(20,22,28,.95);border:1px solid rgba(100,120,160,.3);border-radius:6px;padding:10px 12px;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.6);display:flex;flex-direction:column;gap:4px;}
  .tooltip-name{font-size:14px;font-weight:bold;color:var(--accent);}
  .tooltip-category{font-size:12px;color:#aaa;}
  .tooltip-shelf-life{font-size:12px;color:#e8784a;}
  /* [营地交易优化] 货架 Tips 末行的物品描述：与上面几行之间拉一条分隔线 */
  .tooltip-des{font-size:12px;color:#c9c9c9;line-height:1.55;max-width:240px;
    border-top:1px solid rgba(255,255,255,.12);padding-top:5px;margin-top:1px;}
  /* 投送面板三维水位条的说明浮层：首行是它是什么（亮），其后每行一件事（补充途径 / 影响，带小圆点），
     分隔线下是箭头说明的灰色脚注 */
  .dimtip-body{max-width:260px;display:flex;flex-direction:column;gap:3px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px;margin-top:1px;}
  .dimtip-body p{margin:0;font-size:12px;line-height:1.5;color:#c9c9c9;position:relative;padding-left:10px;}
  .dimtip-body p::before{content:"";position:absolute;left:1px;top:.68em;width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,.35);}
  .dimtip-body p.lead{color:#e6e6e6;padding-left:0;}
  .dimtip-body p.lead::before{display:none;}
  .dimtip-foot{max-width:260px;margin-top:4px;padding-top:6px;border-top:1px dashed rgba(255,255,255,.1);display:flex;flex-direction:column;gap:2px;}
  .dimtip-foot p{margin:0;font-size:11px;line-height:1.45;color:#8a8f98;}

  .bag-op-hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;color:var(--text-dim);text-shadow:0 1px 3px rgba(0,0,0,.6);letter-spacing:.3px;pointer-events:none;}
  /* 材料架页签：左栏不画格子，改为分行视图；宽高取格子尺寸锁记下的值，超出纵向滚动 */
  .rack-view{ overflow-y:auto; overflow-x:hidden; border-radius:6px; }
  .rack-view::-webkit-scrollbar{ width:6px; }
  .rack-view::-webkit-scrollbar-thumb{ background:rgba(255,255,255,.18); border-radius:3px; }
  .rack-view::-webkit-scrollbar-track{ background:transparent; }
  /* .sort-btn 的 transition 简写含 visibility，隐藏会被推迟到过渡终点；这里关掉过渡让它立即隐藏 */
  .sort-btn.rack-hidden{ visibility:hidden; transition:none; }
  .rack-view.drop-on{ box-shadow:inset 0 0 0 1px rgba(255,193,7,.75), inset 0 0 14px rgba(255,193,7,.18); }

  /* 投送对象：营地。名单行 = 名字 + 阶段标签 + 三条本期进度（量程＝本期目标）；
     抬头 = 同三条的宽版，带「当前 / 目标 单位」。条身沿用 .sup-track / .sup-fill：未达标黄、达标绿，
     预览段在本单能让该项达标时也转绿。 */
  .sup-name.camp{display:flex;align-items:center;gap:6px;min-width:0;}
  .sup-nmtx{flex:0 1 auto;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;min-width:0;}
  .sup-name.has-trust{display:flex;align-items:center;gap:6px;min-width:0;}
  .sup-name.has-trust .sup-nmtx{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sup-trust{flex:0 0 auto;font-size:10px;font-weight:400;border-radius:3px;padding:0 4px;line-height:15px;white-space:nowrap;border:1px solid transparent;}
  .sup-trust.is-t0{color:#b9b3aa;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.04);}
  .sup-trust.is-t1{color:var(--accent);border-color:rgba(255,193,7,.4);background:rgba(255,193,7,.10);}
  .sup-trust.is-t2{color:#1a1100;border-color:var(--accent);background:linear-gradient(180deg,#FFD24A,#FFC107);font-weight:700;}
  /* 信赖下降原因小字：与 PhoneSMS .trust-down 同款（紧贴标签、偏红、箭头由 CSS 加） */
  .sup-trust-down{flex:0 0 auto;margin-left:-3px;font-size:10px;font-weight:400;color:#ff8a80;white-space:nowrap;}
  .sup-trust-down::before{content:"\2193";margin-right:1px;}
  /* 三维趋势箭头（每条水位条后面）：t.*Trend 1 升 / -1 降 / 0 不画。口径＝他自己最近 3 天的累计净变化（死区 1.5 天用量，种子/材料的锯齿不算下降），
     不含玩家投送（Logic GetDimTrend）——本单效果由预览段与 +N 回答，两者不混。
     槽位恒占 8px，持平的行不会让后面的 +N / 存粮文字左右跳。 */
  .sup-trend{flex:0 0 8px;width:8px;font-size:10px;font-style:normal;font-weight:700;line-height:1;text-align:center;}
  .sup-trend.up{color:#66bb6a;}
  .sup-trend.up::before{content:"\2191";}
  .sup-trend.down{color:#ff5252;}
  .sup-trend.down::before{content:"\2193";}
  /* 最近一次遭灾（t.mishap，0 不显示）：标签 + 意外名，一行小字。 */
  .sup-mishap{display:flex;align-items:center;gap:4px;font-size:10px;color:#c9a27a;white-space:nowrap;overflow:hidden;min-width:0;}

.item.q-normal{border-color:rgba(255,255,255,0.55);}
.item.q-fail{border-color:#707070;box-shadow:inset 0 0 14px rgba(0,0,0,0.55), 0 0 4px rgba(0,0,0,0.3);filter:saturate(0.5) brightness(0.85);}
.item.q-fail img{filter:grayscale(0.55);}
.item.expired{border-color:rgba(178,72,55,0.75) !important;}
.expired-mask{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:0;
  background:linear-gradient(to top, rgba(146,52,38,0.7) 0%, rgba(146,52,38,0.45) 35%, rgba(146,52,38,0.15) 75%, rgba(146,52,38,0) 100%);}
.near-expiry-mask{position:absolute;inset:0;border-radius:3px;pointer-events:none;z-index:5;
  background:linear-gradient(to top,rgba(255,210,60,.42) 0px,rgba(255,210,60,.18) 5px,rgba(255,210,60,0) 12px)}
.polluted-ring{position:absolute;inset:0;border:2px solid rgba(140,220,110,0.9);border-radius:6px;
  box-shadow:inset 0 0 12px rgba(110,190,90,0.55);pointer-events:none;z-index:4;animation:polluted-breathe 2s ease-in-out infinite;}
@keyframes polluted-breathe{0%,100%{opacity:0.55;}50%{opacity:1;}}
.item.in-action{border-color:rgba(38,198,218,0.85);}
.action-glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;opacity:0.85;
  box-shadow:inset 0 0 8px rgba(38,198,218,0.35), inset 0 0 2px rgba(38,198,218,0.55);}
.item.in-action.using .action-glow{animation:action-mark-breathe 1.6s ease-in-out infinite;}
@keyframes action-mark-breathe{0%,100%{opacity:0.45;}50%{opacity:1;}}
.unread-dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;border-radius:50%;background:#ff4d4d;border:1px solid rgba(0,0,0,.6);pointer-events:none;z-index:7;}
.grid-container.is-frozen .slot{ background:var(--slot-frozen-bg); border-color:rgba(130,180,240,.45);}
.grid-container.is-frozen .slot.valid-hover{ background:rgba(164,181,70,0.22); border-color:var(--bio-green);}
.grid-container.is-frozen .slot.invalid-hover{ background:rgba(224,85,85,0.2); border-color:var(--danger-red);}
.grid-container.is-frozen .item{ --item-underlay:var(--slot-frozen-bg); border-color:rgba(130,180,240,.5);}
.item-frost{ position:absolute; inset:0; pointer-events:none; border-radius:3px;
  background-image:url('../BackpackUI/Refrigerator_ICE.png'); background-size:100% auto; background-repeat:no-repeat; background-position:top center; z-index:3;}
.grid-container.full-warn{border-color:rgba(224,85,85,.55);}

/* ── 屏幕 ── */
.hub-top{height:var(--scr-h);flex-shrink:0;display:flex;margin-top:var(--scr-gap);}
.scr{position:relative;flex:1;min-width:0;height:100%;display:flex;flex-direction:column;overflow:hidden;
  color:var(--text-main);border-radius:8px;padding:10px 12px;background:var(--th-scr-glow), var(--th-scr);
  border:1px solid var(--border-color);box-shadow:inset 0 5px 20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.06);}
.sh{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:bold;letter-spacing:.5px;color:var(--text-dark);
  padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--border-color);flex-shrink:0;}
.sh .led{width:4px;height:14px;border-radius:2px;background:var(--warm-gold);box-shadow:0 0 8px rgba(var(--gold-rgb),.8);flex-shrink:0;}
.sh .clk{margin-left:auto;color:var(--warm-gold);font-weight:normal;font-family:Consolas,"Microsoft YaHei",monospace;font-size:12px;white-space:nowrap;}
.sh .shb{height:26px;padding:0 11px;margin-left:auto;border-radius:6px;border:1px solid var(--border-light);color:var(--text-main);
  background:rgba(255,255,255,.04);font-size:12px;font-weight:normal;cursor:pointer;display:flex;align-items:center;gap:5px;}
.sh .shb:hover{border-color:rgba(var(--acc-rgb),.45);background:rgba(var(--gold-rgb),.08);}
.sh .shb svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;}
.sh .shb + .clk{margin-left:12px;}
.sf{flex-shrink:0;margin-top:6px;padding-top:6px;border-top:1px solid var(--border-color);color:var(--text-faint);letter-spacing:.5px;font-size:11px;}
.scr-body{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding-right:4px;margin-right:-5px;}
.scr-body::-webkit-scrollbar{width:4px;}
.scr-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.21);}
.scr-body.fill{overflow:hidden;display:flex;flex-direction:column;}
.scr-body.center{display:flex;flex-direction:column;}
.ssec{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:bold;letter-spacing:.5px;color:var(--text-dark);
  padding:7px 0 5px;margin-top:5px;border-top:1px solid rgba(255,255,255,.08);}
.ssec .r{margin-left:auto;color:var(--text-faint);font-weight:normal;letter-spacing:.5px;}
.ssec .sw{margin-left:auto;}
.ssec.gap{margin-top:16px;padding-top:9px;}
.salert{margin:6px 0 0;padding:6px 10px;font-size:11.5px;line-height:1.6;display:flex;gap:8px;align-items:flex-start;flex-shrink:0;
  border-radius:6px;color:#ff8a80;background:rgba(255,82,82,.08);border:1px solid rgba(255,82,82,.4);}
.salert .ex{font-family:Consolas,monospace;font-weight:700;color:#FF5252;flex-shrink:0;}
.salert .amain{flex:1;min-width:0;}
.salert .aline + .aline{margin-top:2px;}
.salert.inl .amain{display:flex;align-items:center;gap:10px;}
.minis{display:flex;flex-wrap:wrap;gap:4px;}
.mini{width:30px;height:30px;position:relative;border-radius:4px;background:var(--slot-bg);border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.mini img{width:24px;height:24px;object-fit:contain;}
.mini .item-count{font-size:10px;bottom:0;right:2px;}

/* 机队停机位 */
.fleet-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;}
.bays{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;}
.bay{width:128px;padding:8px 4px;border-radius:8px;text-align:center;cursor:pointer;position:relative;
  background:rgba(0,0,0,.22);border:1px solid var(--border-color);transition:background .15s, border-color .15s;}
.bay:hover{background:rgba(var(--gold-rgb),.06);border-color:rgba(var(--acc-rgb),.45);}
.fleet-empty{font-size:12px;color:var(--text-dark);}
.pad{position:relative;margin:0 auto;border-radius:50%;
  background:radial-gradient(circle, rgba(var(--gold-rgb),.16) 0%, rgba(var(--gold-rgb),.05) 48%, transparent 70%);}
.pad.m{width:72px;height:72px;}
.pad.xl{width:80px;height:80px;flex-shrink:0;}
.pad img.dr{position:absolute;left:50%;top:50%;width:78%;transform:translate(-50%,-50%);filter:brightness(1.3) drop-shadow(0 3px 4px rgba(0,0,0,.6));}
.pad svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
.pad svg.ring .trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:2.2;}
.pad svg.ring .val{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linecap:round;filter:drop-shadow(0 0 3px var(--accent-glow));}
.pad .badge{position:absolute;right:2px;top:2px;min-width:18px;height:18px;padding:0 4px;border-radius:3px;font-size:11px;font-weight:700;line-height:18px;
  color:#1a1a1a;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
.st-out .pad, .st-aid .pad{background:none;}
.st-out .pad::before, .st-aid .pad::before{content:'';position:absolute;inset:14%;border-radius:50%;border:1px dashed rgba(255,255,255,.25);}
.st-out .pad img.dr, .st-aid .pad img.dr{opacity:.16;filter:grayscale(1) brightness(1.4);}
.st-aid .pad::before{border-color:rgba(255,138,128,.45);}
.st-aid .pad svg.ring .val{stroke:#ff8a80;filter:none;}
.st-hold .pad{background:radial-gradient(circle, rgba(var(--gold-rgb),.32) 0%, rgba(var(--gold-rgb),.08) 50%, transparent 70%);}
.st-done .pad{background:radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 62%);}
.st-done .pad img.dr{filter:brightness(1.15) drop-shadow(0 3px 4px rgba(0,0,0,.6));}
.bn{margin-top:4px;font-weight:600;font-size:12.5px;font-family:Consolas,monospace;letter-spacing:1px;color:var(--text-main);}
.bs{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;margin-top:2px;color:var(--bio-green);}
.bs i{width:5px;height:5px;border-radius:50%;background:var(--bio-green);flex-shrink:0;box-shadow:0 0 5px rgba(164,181,70,.7);}
.bx{font-size:10.5px;color:var(--text-dark);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.st-out .bs{color:#f6e6cd;} .st-out .bs i{background:#f6e6cd;box-shadow:none;animation:blink 1.6s ease-in-out infinite;}
.st-hold .bs{color:var(--warm-gold);} .st-hold .bs i{background:var(--warm-gold);box-shadow:none;}
.st-aid .bs{color:#ff8a80;} .st-aid .bs i{background:#ff8a80;box-shadow:none;}
.st-done .bs{color:var(--text-faint);} .st-done .bs i{background:var(--text-faint);box-shadow:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}

/* 单机页 */
.dtop{display:flex;flex-direction:column;align-items:stretch;gap:6px;padding:6px 4px 4px;}
.dhero{min-width:0;display:flex;align-items:center;gap:22px;}
.dinfo{flex:1;min-width:0;}
.dn{display:flex;align-items:baseline;gap:10px;font-size:20px;font-weight:600;font-family:Consolas,monospace;letter-spacing:2px;color:var(--text-main);}
.dn small{font-size:11px;font-weight:normal;letter-spacing:1px;color:var(--text-faint);font-family:Consolas,"Microsoft YaHei",monospace;}
.dinfo .bs{font-size:13px;margin-top:5px;}
.dinfo .dt{color:var(--text-dark);margin-left:6px;}
.dtrip{margin-top:8px;font-size:11.5px;color:var(--text-dark);line-height:1.65;}
.dtrip b{color:var(--text-main);font-weight:600;}
.dq{margin-top:8px;font-size:11.5px;letter-spacing:.5px;color:var(--text-dark);}
.dq b{font-family:Consolas,monospace;font-weight:600;color:var(--text-main);}
.dq b.used{color:var(--text-faint);}
.dq .sep{margin:0 8px;opacity:.6;}
.r2{margin-top:7px;display:flex;align-items:center;gap:9px;}
.r2 .txt{font-size:11px;color:var(--text-dark);flex-shrink:0;}
.trip{flex:1;height:6px;border-radius:3px;background:var(--weight-bar-bg);box-shadow:inset 0 1px 2px rgba(0,0,0,.6);overflow:hidden;}
.trip i{display:block;width:100%;height:100%;border-radius:3px;background:var(--weight-bar-fill);transform-origin:left;}
.st-aid .trip i, .lrow.k-aid .trip i{background:linear-gradient(90deg,#b04030 0%,#FF5252 100%);}
/* 自动拾荒：开关与四个时段同一行（屏幕只有 --scr-h 高，分两行时「待卸货」警告条会被挤出屏幕） */
.dfor{display:flex;align-items:center;gap:12px;padding-top:7px;border-top:1px solid rgba(255,255,255,.08);}
.dfor .ssec{margin:0;padding:0;border-top:none;flex-shrink:0;}
.dfor .segs4{flex:1;min-width:0;margin-top:0;}
.segs4{display:grid;grid-template-columns:repeat(4,1fr);margin-top:8px;border:1px solid var(--border-light);border-radius:6px;overflow:hidden;}
.segs4 b{font-weight:normal;padding:5px 0;text-align:center;cursor:pointer;color:var(--text-dark);line-height:1.4;}
.segs4 b + b{box-shadow:inset 1px 0 0 var(--border-color);}
.segs4 b span{display:block;font-size:12px;}
.segs4 b em{display:block;font-style:normal;font-size:10.5px;font-family:Consolas,monospace;opacity:.8;}
.segs4 b:hover{background:rgba(var(--gold-rgb),.1);color:var(--text-main);}
.segs4 b.on{background:var(--accent);color:#1a1a1a;font-weight:600;cursor:default;}
.segs4.off{opacity:.35;pointer-events:none;}
.sw{width:38px;height:20px;border-radius:10px;position:relative;cursor:pointer;flex-shrink:0;border:1px solid var(--border-light);background:rgba(0,0,0,.3);}
.sw i{position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#6a6a6a;}
.sw.on{background:rgba(var(--acc-rgb),.2);border-color:rgba(var(--acc-rgb),.6);}
.sw.on i{left:20px;background:var(--accent);box-shadow:0 0 8px var(--accent-glow);}
/* 派遣记录 */
.lfils{padding:4px 0 6px;border-bottom:1px solid var(--border-color);flex-shrink:0;}
.lfil{display:flex;align-items:center;gap:8px;padding:3px 0;}
.lfil .lb{flex-shrink:0;font-size:11px;color:var(--text-dark);}
.segs{display:flex;border:1px solid var(--border-light);border-radius:6px;overflow:hidden;}
.segs b{font-weight:normal;padding:3px 7px;font-size:11px;color:var(--text-dark);cursor:pointer;}
.segs b + b{border-left:1px solid var(--border-color);}
.segs b:hover{background:rgba(var(--gold-rgb),.1);color:var(--text-main);}
.segs b.on{background:var(--accent);color:#1a1a1a;font-weight:600;cursor:default;}
.lday{display:flex;align-items:center;gap:8px;padding:9px 0 5px;font-size:11px;letter-spacing:.5px;color:var(--text-dark);font-weight:bold;}
.lday::after{content:'';flex:1;border-top:1px solid rgba(255,255,255,.08);}
.lday .r{order:2;color:var(--text-faint);font-weight:normal;}
.lrow{display:flex;gap:10px;padding:8px 9px;border-radius:8px;background:rgba(0,0,0,.22);border:1px solid var(--border-color);}
.lrow + .lrow{margin-top:5px;}
.lk{width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--border-color);background:rgba(255,255,255,.03);}
.lk svg{width:16px;height:16px;fill:none;stroke:var(--warm-gold);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.lrow.k-aid .lk svg{stroke:#ff8a80;}
.lrow.k-task .lk svg{stroke:#ffcf8a;}
.lm{flex:1;min-width:0;}
.lt{display:flex;align-items:baseline;gap:7px;font-size:12.5px;color:var(--text-main);}
.lt .ln{flex-shrink:0;font-family:Consolas,monospace;font-weight:600;letter-spacing:1px;color:var(--text-main);}
.lt .lkind{flex-shrink:0;font-size:10.5px;line-height:15px;padding:0 5px;border-radius:3px;color:var(--warm-gold);border:1px solid rgba(var(--acc-rgb),.45);}
.lt .ld{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lt .ltime{flex-shrink:0;font-family:Consolas,monospace;font-size:11px;color:var(--text-faint);}
.lgoods{display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;margin-top:6px;}
.lg{display:flex;align-items:center;gap:3px;}
.lg .gl{font-size:10.5px;color:var(--text-faint);margin-right:3px;}
.lg .mini{width:28px;height:28px;}
.lg .mini img{width:22px;height:22px;}
.lres{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:var(--text-dark);}
.lres i{width:5px;height:5px;border-radius:50%;background:var(--bio-green);flex-shrink:0;}
.lres .lsub{color:var(--text-faint);}
.lres.out{color:#f6e6cd;} .lres.out i{background:#f6e6cd;animation:blink 1.6s ease-in-out infinite;}
.lres.hold{color:var(--warm-gold);} .lres.hold i{background:var(--warm-gold);}
.lres.aid{color:#ff8a80;} .lres.aid i{background:#ff8a80;}
.lres.none i{background:var(--text-faint);}
.lres.meet{color:#c5d77a;} .lres.meet i{background:#c5d77a;}
.lres.fight{color:#ffcf8a;} .lres.fight i{background:#ffcf8a;}
.lrow .trip{margin-top:6px;height:4px;flex:none;}
.lempty{padding:26px 10px;text-align:center;font-size:12px;color:var(--text-faint);}
/* 派遣记录整页不参与面板宽度的内容尺寸计算（width:0 + min-width:100%）：面板宽度由主页/货舱决定，
   切到记录页时货物图标行、筛选条只在现有宽度内折行/省略，不把 fit-content 的 .pane.hub 撑宽。 */
.logwrap{flex:1;min-height:0;display:flex;flex-direction:column;width:0;min-width:100%;}

/* ── 实体部件：货舱 ── */
.cargo{margin-top:var(--cargo-gap);border-radius:8px;padding:10px 10px 11px;flex-shrink:0;
  background:var(--th-panel);border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 2px 10px rgba(0,0,0,.4), 0 4px 15px rgba(0,0,0,.2);}
.ptitle{display:flex;align-items:center;height:26px;font-size:14px;font-weight:bold;letter-spacing:1px;color:var(--warm-gold);
  text-shadow:0 0 10px rgba(var(--gold-rgb),.4);margin-bottom:9px;}
.ptitle::before{content:'';width:4px;height:15px;background:var(--warm-gold);margin-right:8px;border-radius:2px;box-shadow:0 0 8px rgba(var(--gold-rgb),.8);}
.ptitle .num{margin-left:auto;font-family:Consolas,monospace;font-size:12px;font-weight:normal;color:var(--text-dark);letter-spacing:.3px;}
.ptitle .num b{color:var(--text-main);font-weight:600;}
.ptitle.over .num,.ptitle.over .num b{color:var(--danger-red);}
.ptitle .sortb{margin-left:auto;}
.ptitle .sortb + .num{margin-left:12px;}

/* 按钮（货舱侧） */
.gbtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:6px;white-space:nowrap;
  font-size:12.5px;font-weight:bold;color:#e8ecd0;cursor:pointer;user-select:none;
  background:linear-gradient(to bottom, rgba(58,66,42,.92), rgba(33,38,24,.92));
  border:1px solid rgba(164,181,70,.5);box-shadow:inset 0 2px 6px rgba(0,0,0,.55);text-shadow:0 1px 2px rgba(0,0,0,.6);}
.gbtn:hover:not(:disabled){border-color:var(--bio-green);background:linear-gradient(to bottom, rgba(70,80,50,.95), rgba(40,46,29,.95));}
.gbtn .ar{width:0;height:0;border-right:8px solid var(--bio-green);border-top:5px solid transparent;border-bottom:5px solid transparent;}
.gbtn .caret{font-size:8px;color:var(--bio-green);}
.gbtn:disabled{opacity:.42;filter:grayscale(.7);cursor:default;}
.gbtn:disabled .ar{border-right-color:#8a8a8a;}
.gbtn.sm{padding:4px 12px;font-size:12px;letter-spacing:.5px;}
.catwrap{position:relative;}
.catwrap.open .caret{display:inline-block;transform:rotate(180deg);}
.catmenu{display:none;position:absolute;left:0;top:calc(100% + 4px);z-index:40;min-width:128px;padding:4px;border-radius:6px;
  background:linear-gradient(180deg, rgba(60,52,47,.98), rgba(38,31,27,.98));border:1px solid rgba(var(--gold-rgb),.35);box-shadow:0 10px 24px rgba(0,0,0,.8);}
.catwrap.open .catmenu{display:block;}
.catopt{padding:5px 10px;font-size:11.5px;color:#d8d3c4;border-radius:3px;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;}
.catopt:hover{background:rgba(var(--gold-rgb),.14);color:var(--text-main);}
.catopt .qty{margin-left:auto;font-family:Consolas,monospace;font-size:10.5px;color:#8a8a8a;}
.catopt.empty{color:#8a8a8a;cursor:default;}
.catopt.empty:hover{background:transparent;color:#8a8a8a;}

/* ── 两列中间：中控台货舱 → 储物 的取出按钮（顶边距取 .hub-root 的 --take-top） ── */
.midcol{align-self:stretch;flex-shrink:0;width:112px;position:relative;z-index:3;display:flex;flex-direction:column;justify-content:flex-start;
  padding-top:var(--take-top);}
.mc-take{flex-shrink:0;display:flex;flex-direction:column;gap:10px;}
.mc-take .mc-l{font-size:11.5px;letter-spacing:1px;color:var(--text-dark);text-align:center;}
.mc-take .gbtn{width:100%;padding:8px 10px;}

/* 同类预览高亮（2026-09-23）：按住高亮键悬停某件时本栏同类一起描边。
   class 由 webui-bag.js 的 setKinHint 打在容器和格子上。
   transition:none 是必须的——.item 多半带 box-shadow/border-color 过渡，不覆盖会渐显 200ms，
   比整条推送链路还慢（背包面板跑测第一反馈就是「反应慢」）。配色与背包面板同一支亮黄。 */
.grid-container.kin-active .item.kin-hint{
  transition:none;
  border-color:rgba(255,233,74,1) !important;

-guide-step-icons-dual\">\n                            \u003cdiv class=\"cook-guide-step-icon-box\">\n                                \u003cimg src=\"../../Res/Material/UI_Item_Icon_Mat_S_1503002201.png\" alt=\"卡式气瓶\">\n                            \u003c/div>\n                            \u003cspan class=\"cook-guide-dual-or\" id=\"cookGuideDualOr\">或\u003c/span>\n                            \u003cdiv class=\"cook-guide-step-icon-box\">\n                                \u003cimg src=\"../../Res/Furniture/UI_Item_Icon_taiyangnengda.png\" alt=\"太阳能电板\">\n                            \u003c/div>\n                        \u003c/div>\n                        \u003cdiv class=\"cook-guide-step-text\">\n                            \u003cstrong id=\"cookGuideStep2Label\">供能\u003c/strong>\u003cspan id=\"cookGuideStep2Text\">柴火灶塞燃料，电烹具靠电力驱动\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                    \u003cdiv class=\"cook-guide-step\">\n                        \u003cdiv class=\"cook-guide-step-icon-box\">\n                            \u003cimg src=\"../../Res/Food/UI_Item_Icon_Food_niuroudunjuanxincai.png\" alt=\"菜肴\">\n                        \u003c/div>\n                        \u003cdiv class=\"cook-guide-step-text\">\n                            \u003cstrong id=\"cookGuideStep3Label\">开火\u003c/strong>\u003cspan id=\"cookGuideStep3Text\">点【开始烹饪】，右上会提前告诉你能做出什么\u003c/span>\n                        \u003c/div>\n                    \u003c/div>\n                \u003c/div>\n                \u003cdiv class=\"cook-guide-footer\">\u003cdiv class=\"cook-guide-click-hint\" id=\"cookGuideClickHint1\">点击任意位置继续\u003c/div>\u003c/div>\n            \u003c/div>\n\n            \u003cdiv class=\"cook-guide-view\" data-step=\"2\">\n                \u003cdiv class=\"cook-guide-line\" id=\"cookGuideStorageHead\">食材从哪儿拿？\u003c/div>\n                \u003cdiv class=\"cook-guide-tabs-wrap\">\n                    \u003cdiv class=\"cook-guide-tabs\">\n   /* 一键入库：背包物品按物品分类（食材/菜品/材料/医疗/饮品/燃料）匹配柜子标签，

  /* 一键整理：同名叠合并 + 按分类归位（官方背包底部 action-btn 同位同图标） */

      var it = arr[i], g = byName[it.name];
      if (!g) { byName[it.name] = it; order.push(it); }
      else g.count += it.count;
    }
    order.sort(function (a, b) {

  /* 【原型模拟，非实现口径】取出/放入在实现里=官方 DOM 原件上的官方原生动作

     本函数仅供原型演示数据流动，实现侧无对应物。 */
  function takeEntries(entries, all) {
    var bag = itemsOf(1), bagCap = ctnById(1).cap, total = 0, name = entries.length ? entries[0].name : '';
    for (var i = 0; i < entries.length; i++) {
      var it = entries[i];
      if (it.ctnId === 1) continue;                 /* 背包自己的行/格：取出无意义 */
      var n = all ? it.count : 1;
      if (n <= 0) continue;
      var stack = null;
      for (var b = 0; b < bag.length; b++) if (bag[b].name === it.name) { stack = bag[b]; break; }
      if (stack) stack.count += n;
      else if (bag.length < bagCap) {
        var cp = {};
        for (var k in it) cp[k] = it[k];
        cp.id = ++SEQ; cp.ctnId = 1; cp.src = nm(ctnById(1)); cp.count = n;

      it.count -= n; total += n;

      var cp = {};
      for (var k in it) cp[k] = it[k];

      arr.push(cp);
    } else { sbToast(nm(tgt) + ' 已满'); return; }
    it.count -= n;
    if (it.count <= 0) {
      var bi = itemsOf(1).indexOf(it);
      if (bi >= 0) itemsOf(1).splice(bi, 1);
    }

  /* 转移匹配：cat = null(全部) | 分类名 | 标签数组（按标签放入） */
  function catMatch(it, cat) {
    if (!cat) return true;
    if (Array.isArray(cat)) return cat.indexOf(it.cat) >= 0;
    return it.cat === cat;
  }
  function catLabel(cat) { return Array.isArray(cat) ? cat.join('·') : cat; }
  /* 中间转移按钮（官方改版背包同款五按钮）：全部取出/放入 = 整叠批量互转；
     分类取出/分类放入 = 只转指定分类；按标签放入 = 按右侧柜子标签规则放。
     满则整叠跳过计数，绝不半叠拆分 */
  function putAllToCabinet(cat) {
    var tgt = ctnById(st.currentId);
    if (!tgt || tgt.id === 1) return;
    var bag = itemsOf(1).slice();
    if (!bag.length) { sbToast('背包是空的'); return; }
    var moved = 0, stay = 0;
    for (var i = 0; i < bag.length; i++) {
      var it = bag[i];
      if (!catMatch(it, cat)) continue;
      var arr = itemsOf(tgt.id), stack = null;
      for (var b = 0; b < arr.length; b++) if (arr[b].name === it.name) { stack = arr[b]; break; }
      if (stack) stack.count += it.count;
      else if (arr.length < tgt.cap) {
        var cp = {};
        for (var k in it) cp[k] = it[k];
        cp.id = ++SEQ; cp.ctnId = tgt.id; cp.src = nm(tgt);
        arr.push(cp);
      } else { stay++; continue; }
      moved += it.count;
      var bi = itemsOf(1).indexOf(it);
      if (bi >= 0) itemsOf(1).splice(bi, 1);
    }
    GCACHE = null; st.sel = null;
    refreshAll();
    if (!moved && !stay) { sbToast('背包里没有命中「' + catLabel(cat) + '」的物品'); return; }
    sbToast(moved ? '已放入 ' + nm(tgt) + ' ' + moved + ' 件' + (cat ? '（' + catLabel(cat) + '）' : '') + (stay ? '，柜满剩 ' + stay + ' 叠' : '') : nm(tgt) + ' 已满');

      for (var b = 0; b < bag.length; b++) if (bag[b].name === it.name) { stack = bag[b]; break; }

  function applyPinOrder(po) {

    CTN.forEach(function (c) { if (c.pin && !c.fixed) map[c.id] = c; else if (!c.pin) rest.push(c); });
    var ordered;
    if (po && po.length) {
      ordered = po.map(function (id) { return map[id]; }).filter(Boolean);
      Object.keys(map).forEach(function (k) { if (ordered.indexOf(map[k]) < 0) ordered.push(map[k]); });
    } else {

    CTN.length = 0;

  function bindPinDrag() {

      st.dragId = parseInt(b.getAttribute('data-ctn'), 10);

      render();

      var b = e.target.closest('[data-ctn]');

      if (!b || parseInt(b.getAttribute('data-ctn'), 10) === st.dragId) return;

      b.classList.add((e.clientX - r.left) < r.width / 2 ? 'drop-before' : 'drop-after');
    });
    row.addEventListener('drop', function (e) {
      e.preventDefault();
      var b = e.target.closest('[data-ctn]'); if (!b || st.dragId == null) return;
      var target = parseInt(b.getAttribute('data-ctn'), 10);
      if (target === st.dragId) return;
      /* 角色背包固定首位不参与排序，只在其余固定页签之间重排 */
      var fixedC = CTN.filter(function (x) { return x.pin && x.fixed; });
      var pins = CTN.filter(function (x) { return x.pin && !x.fixed; });
      if (target === (fixedC[0] && fixedC[0].id)) return;
      var from = -1, to = -1;
      for (var i = 0; i < pins.length; i++) {
        if (pins[i].id === st.dragId) from = i;
        if (pins[i].id === target) to = i;
      }
      if (from < 0 || to < 0) return;
      var r = b.getBoundingClientRect();
      var after = (e.clientX - r.left) >= r.width / 2;
      var order = pins.map(function (p) { return p.id; });
      order.splice(from, 1);
      order.splice(order.indexOf(target) + (after ? 1 : 0), 0, st.dragId);
      var pinMap = {};
      pins.forEach(function (p) { pinMap[p.id] = p; });
      var restCtn = CTN.filter(function (x) { return !x.pin; });
      CTN.length = 0;
      fixedC.forEach(function (p) { CTN.push(p); });
      order.forEach(function (id) { CTN.push(pinMap[id]); });

      else for (var i = 0; i < st.rows * COLS; i++) h += i < fi.length ? slotHtml(fi[i], 'sr-slot') : '<div class="sr-slot empty"></div>';
      el.srGrid.innerHTML = h;
    } else {
      el.srGrid.hidden = true; el.srList.hidden = false;
      var d = DYN[st.sort] || DYN.value;
      /* 列表 = 同名汇总：一行一种物品，数量 = 各叠合计（右键取 1，Shift+右键整行） */
      var groups = [], byName = {};
      for (var j = 0; j < fi.length; j++) {
        var it = fi[j];
        var g = byName[it.name];
        if (!g) {
          g = { name: it.name, emoji: it.emoji, cat: it.cat, total: 0, entries: [], minShelf: it.shelf, val: 0, srcs: [] };
          byName[it.name] = g; groups.push(g);
        }
        g.total += it.count; g.entries.push(it);
        g.val += it.value * it.count;
        if (it.shelf < g.minShelf) g.minShelf = it.shelf;
        if (it.src && g.srcs.indexOf(it.src) < 0) g.srcs.push(it.src);
      }
      LISTGRP = groups;
      var lh = '<div class="sr-lhead"><span></span><span>物品</span><span class="num">数量</span><span class="num">' + d.label + '</span></div>';
      for (var gi = 0; gi < groups.length; gi++) {
        var g2 = groups[gi];
        var dyn = st.sort === 'value' ? g2.val : d.f(g2.entries[0]);
        lh += '<button type="button" class="sr-row' + (st.sel === g2.entries[0].id ? ' selected' : '') + '" data-grp="' + gi + '" data-it="' + g2.entries[0].id + '">' +
          '<span class="ico">' + g2.emoji + '</span><span class="main"><span class="nm">' + esc(g2.name) + '</span>' +
          '<span class="sub">' + g2.cat + ' · ' + g2.entries.length + ' 叠 · 保质 ' + g2.minShelf + 'h' +
          (g2.srcs.length ? ' · <i class="src">' + esc(g2.srcs[0]) + (g2.srcs.length > 1 ? ' 等' + g2.srcs.length + ' 处' : '') + '</i>' : '') +
          '</span></span><span class="cnt">×' + g2.total + '</span><span class="dyn">' + dyn + '</span></button>';
      }
      if (!fi.length) lh = '<div class="sr-empty">没有匹配的物品</div>';
      el.srList.innerHTML = lh;
    }
    renderBagPanel();
    if (typeof fitPage === 'function') fitPage();
  }

  /* ================= v13.2 取用/整理物资：官方页 iframe 真渲染 =================
     mod 改造点（仅此三项，其余官方原生）：
     ① 宽度统一 12 列（mock gridCols=12；正式实现=数据层包/柜 cols 统一 12）
     ② 高度扩容+纵向滚动（max-height+overflow+scrollbar-gutter:stable 不压格）
     ③ 柜子面板不显示负重条（.weight-section 隐藏；取用=整个面板即柜子；整理物资=B 侧柜子）
     取用=单柜面板（InfoAMsg 绑柜子 + canTag:true → 头部=柜名·分类标签按钮，官方原生渲染）；
     整理物资=官方双背包（InfoA/InfoB/ItemsA/ItemsB 喂数）。 */
  var ICOA2 = 'data:image/gif;base64,R0lGODlhAQABAIAAAPLt4gAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==#a';
  var ICOB2 = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==#b';
  function liveItem(id, x, y, n, ico) { return { id: id, x: x, y: y, w: 1, h: 1, icon: ico || ICOA2, name: '物品' + id, count: n || 3, quality: 3 }; }
  function liveBag(n, rows) {
    var out = [], id = 901;
    for (var y = 0; y < rows; y++) for (var x = 0; x < 12 && out.length < n; x++)
      out.push(liveItem(id++, x, y, 2 + ((id * 7) % 40), (x + y) % 3 === 0 ? ICOB2 : ICOA2));
    return out;
  }
  function livePost(fr, type, data) { try { fr.contentWindow.postMessage({ type: type, data: data }, '*'); } catch (e) { } }
  function liveMods(fr, extra) {
    try {
      var d = fr.contentDocument;
      var st = d.createElement('style');
      st.setAttribute('data-proto-mod', '1');
      st.textContent = '/* mod 点②③ */' +
        '.grid-container{max-height:560px;overflow-y:auto;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:rgba(255,193,7,.5) transparent}' +
        '.grid-container::-webkit-scrollbar{width:8px}.grid-container::-webkit-scrollbar-thumb{background:rgba(255,193,7,.45);border-radius:4px}' +
        /* 滚动条不得压格：官方 JS 写死 .grid-container{width:cols*56px}+全页 border-box，滚动槽(~10px)会从
           该宽度里扣 → 格底 repeat(12,56px) 轨道与绝对定位物品层一起被顶进滚动条底下。
           content-box+行末 padding 让滚动槽加在官方宽度之外：格底/物品恢复完整 12×56，滚动条独立在右侧 */
        '.grid-container{box-sizing:content-box;padding-right:12px}' +
        (extra || '');
      d.head.appendChild(st);
      var bd = d.createElement('div');
      bd.textContent = '原型 · 12列 · 高度滚动';
      bd.style.cssText = 'position:fixed;right:10px;bottom:10px;z-index:999;padding:4px 10px;border-radius:99px;background:rgba(20,24,36,.92);border:1px solid rgba(240,176,60,.55);color:#ffe1a0;font-size:12px;pointer-events:none';
      d.body.appendChild(bd);
    } catch (e) { }
  }
  function feedLive(fr, kind) {
    if (kind === 'access') {
      /* 取用=单柜面板：柜名+分类标签按钮（canTag），无负重条 */
      livePost(fr, 'WebUI_Backpack_InfoAMsg', { ownerId: 900103, backpackName: '床头柜', gridCols: 12, gridRows: 14, currentWeight: 0, maxWeight: 0 });
      /* 分类标签按钮：canTag 在 InfoBMsg 处理器里（官方结构）——单袋形态补喂一笔仅翻 canTag，
         不带其余字段（bagB 不参与 single 渲染）→ 头部= 柜名 · ＋分类（官方原生） */
      livePost(fr, 'WebUI_Backpack_InfoBMsg', { canTag: true });
      livePost(fr, 'WebUI_Backpack_ItemsAMsg', { itemsJson: JSON.stringify(liveBag(60, 14).map(function (it) { it.id += 700; it.name = '柜藏' + it.id; return it; })) });
      liveMods(fr, '.weight-section{display:none !important}'); /* mod 点③：柜子无负重条 */
    } else if (kind === 'backpack') {
      /* v13.3 单独背包=B 键纯背包页：对齐整理物资背包侧（同一只 仓管背包·12列·同数据），
         负重条保留（mod 点③只藏柜侧），无 InfoB/canTag（单袋形态，头部无分类按钮） */
      livePost(fr, 'WebUI_Backpack_InfoAMsg', { ownerId: 900001, backpackName: '仓管背包', gridCols: 12, gridRows: 12, currentWeight: 8, maxWeight: 60 });
      livePost(fr, 'WebUI_Backpack_ItemsAMsg', { itemsJson: JSON.stringify(liveBag(48, 12)) });
      liveMods(fr, '');
    } else {
      livePost(fr, 'WebUI_Backpack_InfoAMsg', { ownerId: 900001, backpackName: '仓管背包', gridCols: 12, gridRows: 12, currentWeight: 8, maxWeight: 60, isDualBag: true });
      livePost(fr, 'WebUI_Backpack_InfoBMsg', { ownerId: 900103, backpackName: '床头柜', gridCols: 12, gridRows: 12, currentWeight: 0, maxWeight: 0, canTag: true });
      livePost(fr, 'WebUI_Backpack_ItemsAMsg', { itemsJson: JSON.stringify(liveBag(48, 12)) });
      livePost(fr, 'WebUI_Backpack_ItemsBMsg', { itemsJson: JSON.stringify(liveBag(40, 12).map(function (it) { it.id += 500; it.name = '柜藏' + it.id; return it; })) });
      liveMods(fr, '.bag-panel.is-storage .weight-section{display:none !important}'); /* mod 点③：柜侧无负重条（背包侧保留） */
    }
  }
  function setSceneLive(key) {
    var kind = DATA.scenes[key].live;
    var g = document.getElementById('gpage');
    /* width:100% 必须显式给：.gfit 绝对定位无宽度会 shrink-to-fit 塌到 iframe 默认 300px，
       官方页 applyViewportFit 按容器算 zoom → 整页被压到 ~17%（"放大镜"病根） */
    g.innerHTML = '<div class="gfit" style="width:100%;height:100%">' + DATA.scenes[key].body + '</div>';
    var fr = g.querySelector('iframe.proto-live');
    if (!fr) return;
    fr.style.cssText = 'width:100%;height:100%;border:0;border-radius:14px;background:#111;display:block';
    var fed = 0;
    fr.addEventListener('load', function () { setTimeout(function () { feedLive(fr, kind); }, 500); });
    var t = setInterval(function () {
      fed++;
      try { if (fr.contentDocument && fr.contentDocument.body && fr.contentDocument.body.children.length) { feedLive(fr, kind); if (fed > 5) clearInterval(t); } } catch (e) { }
      if (fed > 20) clearInterval(t);
    }, 1200);
  }

  /* 场景切换：换官方页 DOM + 启用对应 CSS + 载入该场景的页签顺序/快捷标签 + 回入口默认容器 + 插入侧栏 */
  function setScene(key) {
    st.scene = key;
    /* v13.2：取用/整理物资=官方页 iframe 真渲染场景——不注入 rail，喂数+mod CSS */
    if (DATA.scenes[key] && DATA.scenes[key].live) { setSceneLive(key); return; }
    loadScenePrefs();
    st.currentId = SCENE_DEF[key] || 1;
    /* B 键单独背包 = 纯背包页：柜子页签栏/全库切换都不显示（bagonly），跨柜搜索一并关闭 */
    if (key === 'backpack' && st.global) { st.global = false; st.mode = st.prevMode || 'grid'; }
    /* 机器界面（plain，v13.5）：搜索/快捷标签/工具行不显示 → 固定网格+本柜+清筛选；
       排序随场景：食品类设施=官方默认（页脚左下角可改），交易=计算后交易价值，其余=官方默认 */
    if (PLAIN.indexOf(key) >= 0) {
      st.global = false; st.mode = 'grid'; st.tags = []; st.query = ''; st.dir = 1;
      st.sort = key === 'trade' ? 'tvalue' : 'official';
    } else if (st.sort === 'official' || st.sort === 'tvalue') st.sort = 'value';
    applySize(ctn().cap);
    st.sel = null;
    var styles = root.querySelectorAll('style.gs');
    for (var i = 0; i < styles.length; i++) styles[i].disabled = (styles[i].id !== 'gs-' + key);
    var g = document.getElementById('gpage');
    g.innerHTML = '<div class="gfit">' + DATA.scenes[key].body + '</div>';
    // 图片占位（相对路径在原型里不可达）
    var imgs = g.querySelectorAll('img');
    for (var m = 0; m < imgs.length; m++) imgs[m].src = 'data:image/gif;base64,R0lGODlhAQABAIAAAPLt4gAAACH5BAAAAAAALAAAAAABAAEAAAICRAEAOw==';
    // 插入侧栏（v13：整理柜 = 三段壳，左/右物品区=官方原件占位[实现 reparent]，跨柜=rackOpen）
    var host = findRailHost(g);
    var rail = document.createElement('div');
    rail.className = 'sr-rail ' + DATA.scenes[key].shell + (key === 'backpack' ? ' bagonly' : '') +
      (PLAIN.indexOf(key) >= 0 ? ' plain' : '') + (key === 'trade' ? ' trade' : '');
    rail.id = 'srRail';
    rail.innerHTML = RAIL_HTML;
    if (key === 'rack') {
      var duo = document.createElement('div');
      duo.className = 'sr-duo';
      var bp = document.createElement('div');
      bp.className = 'sr-rail bagpanel';
      bp.id = 'srBagP';
      bp.innerHTML = BAGPANEL_HTML;
      /* v13.1（作者 2026-10-31 裁决）：右段=**普通存储取物面板**——仅 柜名标题+格数副标+
         官方格网格+底栏用量；页签栏/搜索栏/快捷标签栏/排序栏/网格列表切换 一律不要 */
      /* 中段转移按钮列（v13 口径）：「全部取出◀」「放入▶」= 官方 btnTakeAll/btnPutAll 原件
         （实现 reparent，官方监听原样）；「分类取出/分类放入/按标签放入」= mod 增值按钮
         （官方 .transfer-btn 样式，C# 命令通道）。右段物品区 = 官方 #panelB 汇总行原件占位。 */
      var mid = document.createElement('div');
      mid.className = 'transfer-controls';
      mid.innerHTML =
        '<button class="transfer-btn transfer-btn-primary btn-dir-left" id="srTakeAll" type="button" title="右侧当前柜全部取出到背包（整叠，背包满跳过）"><span class="btn-arrow">◀</span><span class="btn-label">全部取出</span></button>' +
        '<div class="category-dropdown-wrapper">' +
        '<button class="transfer-btn category-dropdown-btn btn-dir-left" id="srTakeCat" type="button"><span class="btn-arrow">◀</span><span class="btn-label">分类取出</span></button>' +
        '<div class="category-dropdown" id="srTakeCatMenu" hidden></div></div>' +
        '<div class="transfer-controls-spacer"></div>' +
        '<button class="transfer-btn transfer-btn-primary btn-dir-right" id="srPutAll" type="button" title="背包全部放入右侧当前柜（整叠，柜满跳过）"><span class="btn-label">放入</span><span class="btn-arrow">▶</span></button>' +
        '<div class="category-dropdown-wrapper">' +
        '<button class="transfer-btn category-dropdown-btn btn-dir-right" id="srPutCat" type="button"><span class="btn-label">分类放入</span><span class="btn-arrow">▶</span></button>' +
        '<div class="category-dropdown" id="srPutCatMenu" hidden></div></div>' +
        '<button class="transfer-btn tag-putin-btn" id="srTagPutIn" type="button" title="按右侧柜子的标签规则放入（背包中分类命中标签的物品）">' +
        '<span class="putin-row" id="srTagChips"></span>' +
        '<span class="putin-row putin-main"><span class="btn-label">按标签放入</span><span class="btn-arrow">▶</span></span>' +
        '</button>';
      var plain = document.createElement('div');
      plain.className = 'sr-rail ctnpanel';
      plain.id = 'srCtnP';
      var curCtn = ctnById(st.currentId) || CTN[1];
      plain.innerHTML =
        '<div class="sr-head"><div class="sr-headtxt"><div class="sr-title">' + esc(curCtn.name) + '</div>' +
        '<div class="sr-sub"><b>' + COLS + ' 列</b><span> · ' + curCtn.cap + ' 格</span></div></div></div>' +
        '<div class="sr-body" id="scBody"><div class="sr-grid" id="scGrid"></div></div>' +
        '<div class="sr-hover" id="scHover">官方原件区 · 拖拽/右键/高亮键（官方原生）</div>' +
        '<div class="sr-foot"><div class="sr-foot-l"><span id="scFill"></span><span class="fr" id="scView"></span></div></div>';
      duo.appendChild(bp);
      duo.appendChild(mid);
      duo.appendChild(plain);
      host.parentNode.replaceChild(duo, host);
    } else {
      host.parentNode.replaceChild(rail, host);
    }
    bind();
    bindBagPanel();
    el.rail = rail;
    refreshAll();
  }
  function findRailHost(g) {
    var w = document.createTreeWalker(g, NodeFilter.SHOW_COMMENT, null);
    var n; while ((n = w.nextNode())) if (n.nodeValue === 'RAIL') return n;
    throw new Error('RAIL host not found');
  }

  /* 控制行：只有场景切换 */
  document.getElementById('controls').addEventListener('click', function (e) {
    var sc = e.target.closest('[data-scene]');
    if (!sc) return;
    setScene(sc.getAttribute('data-scene'));
    var all = this.querySelectorAll('[data-scene]');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('scb-on', all[i] === sc);
    fitPage(); fit();
  });

  /* 1:1 缩放：整块画布永远 1536×864，只按窗口等比缩放；页内容恒定，不随柜子/容器变化 */
  var fitwrap = document.getElementById('fitwrap');
  function fit() {
    var w = fitwrap.clientWidth || 960, s = Math.min(1, w / 1536);
    var g = document.getElementById('gpage');
    g.style.transform = s < 1 ? 'scale(' + s + ')' : '';
    fitwrap.style.height = (864 * s + 2) + 'px';
    var badge = document.getElementById('scaleBadge');
    if (badge) badge.textContent = '1536×864 · ' + Math.round(s * 100) + '%';
  }
  /* 页内容适配（同游戏 createViewportFit）：仅当某场景天然超出 1536×864 时等比缩小；
     侧栏高度恒定 816px，同一场景内切柜不再改变页面尺寸 */
  function fitPage() {
    var gf = document.querySelector('#srp .gfit');
    if (!gf) return;
    gf.style.transform = '';
    var w = gf.scrollWidth, h = gf.scrollHeight;
    var k = Math.min(1, 1536 / w, 864 / h);
    gf.style.transform = 'translate(-50%,-50%)' + (k < 1 ? ' scale(' + k + ')' : '');
  }
  window.addEventListener('resize', function () { fitPage(); fit(); });

  try {
    var nt = JSON.parse(localStorage.getItem('srp_ctn_names') || 'null');
    if (nt && typeof nt === 'object') NAMES = nt;
    var tg = JSON.parse(localStorage.getItem('srp_ctn_tags') || 'null');
    if (tg && typeof tg === 'object') {
      TAGOV = tg;
      CTN.forEach(function (c) { if (Array.isArray(TAGOV[c.id])) c.tags = TAGOV[c.id].slice(); });
    }
    var cu = JSON.parse(localStorage.getItem('srp_custom_tags') || 'null');
    if (Array.isArray(cu)) CUSTOM = cu;
  } catch (e) { }
  setScene('cook');
  fitPage();
  fit();
})();

</script>
